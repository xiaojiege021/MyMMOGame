syntax = "proto3";

package mmo.character;

option csharp_namespace = "Mmo.Proto.Character";

// 创建一个角色。字段按技术架构第 6 节「角色主数据」：
// 种族只影响外观与出身对白，不带属性、不锁职业，所以这里只有编号与外观；
// 主线场次与立仙或立魔在创建时为空，不放进请求，直接由服务端落成空。
message CreateCharacterRequest {
  string account = 1;
  string name = 2;
  // 出身编号，四种之一。只决定外观默认值与对白，不带数值。
  string race = 3;
  // 外观选择，JSON 串。只影响样子，服务端不解析成属性。
  string appearance = 4;
  // warrior / archer / mage / priest / tank
  string class_id = 5;
  // 一转分支，可以不填。填了必须与职业对得上。
  string branch = 6;
}

message CreateCharacterResponse {
  uint64 character_id = 1;
  string name = 2;
  string race = 3;
  string appearance = 4;
  string class_id = 5;
  string branch = 6;
  int32 level = 7;
  string realm = 8;
  // 建好之后这两项必须是空的，客户端据此知道还没进主线、还没分路。
  bool main_stage_empty = 9;
  bool alignment_empty = 10;
}

// 角色服。角色的唯一写入在这里，网关只能转请求，不能直接写库。
service CharacterService {
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);

  // 写等级。1–100 可写，超过 100 或小于 1 直接拒绝，不改库里的值。
  // 上限是大版本也不抬的（方案「成长与物品」），所以拒绝而不是夹到 100。
  rpc SetLevel(SetLevelRequest) returns (SetLevelResponse);

  // 背包：往一个格子里放东西。绑定规则由物品表决定，客户端说了不算。
  rpc AddItem(AddItemRequest) returns (InventorySlot);

  // 读回整个背包。这一行只给核对与后续行用，不做界面。
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);

  // 这一格的物品能不能直接交易。绑定物品返回不可交易，原因 bound_item。
  // 交易本身在 P1-5a，这里只给判定。
  rpc CanTrade(CanTradeRequest) returns (CanTradeResponse);

  // 货币加减。delta 可正可负，一条语句原子完成；结果小于 0 直接拒绝（insufficient）。
  rpc AddCurrency(AddCurrencyRequest) returns (CurrencyBalance);

  // 读回全部币种，没有记账的按 0 算。
  rpc GetCurrency(GetCurrencyRequest) returns (GetCurrencyResponse);

  // 发一笔奖：事务号 + 若干条变更，整笔在一个数据库事务里，全成或全退。
  // 同一个事务号再提交不会发第二次，响应里 duplicate=true。
  rpc ApplyGrant(ApplyGrantRequest) returns (ApplyGrantResponse);

  // 进本。主线只允许 1 人、不扣疲劳不占周份额；深渊按人数扣疲劳；
  // 巢穴按人数占周份额、按人数记产出份数。
  // 人数与扣减规则都从 config/dungeons.json 来，不在代码里写死。
  rpc EnterDungeon(EnterDungeonRequest) returns (EnterDungeonResponse);

  // 温泉。只把当日已用疲劳减回配置里的 hot_spring_recovery（方案写定 1500），
  // 不动周份额、进本记录、货币、背包和等级。减到 0 为止，不写成负数。
  rpc UseHotSpring(UseHotSpringRequest) returns (UseHotSpringResponse);

  // 等级经验结算。活动、副本、任务、竞技场、战场、城战和世界 Boss 都走这一笔；
  // 同一场至少两个人时这一笔多一截少量加成，只加经验。
  // 请求里没有经验数值，基础值、加成幅度与升级曲线全在 config/exp.json。
  // 同一个 txn_id 再提交不发第二次。
  rpc SettleExp(SettleExpRequest) returns (SettleExpResponse);

  // 强化。三档材料、成功率、金币与石头消耗全在 config/enhance.json，只在角色服判定。
  // 请求里没有等级、成功率、结果和账号余额，客户端说了不算；
  // 扣石头、扣金币、改强化等级在同一笔数据库事务里，失败只掉 1 级。
  // P1-4b：use_coupon 只表示「这一手要不要用背包里的保护券」，券只挡掉级，
  // 不改这一档的成功率；券的编号、数量、来源都不在请求里。
  rpc Enhance(EnhanceRequest) returns (EnhanceResponse);

  // 强化转移（方案 9.3）。请求里只有两个格子：两格强化等级、绑定状态、
  // 转移石编号与张数、金币费用都从角色服的库与 config/transfer.json 读。
  // 来源必须高于目标，成功后来源 +0、目标覆盖为来源原来的等级，
  // 来源绑定时目标在同一笔事务里改为绑定。转移必定成功，不掷点。
  // txn_id 由网关生成，客户端填不进来。
  rpc TransferEnhance(TransferEnhanceRequest) returns (TransferEnhanceResponse);
  // 能量结晶（方案第 9 章第 3 层）：装上与拆下各一次角色服事务，共用同一种回包。
  rpc InstallCrystal(InstallCrystalRequest) returns (CrystalResponse);
  rpc RemoveCrystal(RemoveCrystalRequest) returns (CrystalResponse);

  // 拍卖成交结算（方案第 12 章、开发架构第 14 节第 39 行）。全局服务转过来，
  // 角色服在一笔事务里写买方金币、卖方净额、物品交付与成交状态；
  // 标价、卖方、物品、税率与税额全在服务端读，客户端一个都带不进来。
  rpc SettleAuction(AuctionSettleRequest) returns (AuctionSettleResponse);

  // 元宝寄售成交结算（开发架构第 14 节第 40 行）。全局服务转过来，
  // 角色服在一笔事务里写买方金币、卖方净额、双方元宝与成交状态；
  // 标价、卖方、元宝币种、税率与税额全在服务端读，客户端一个都带不进来。
  rpc SettleIngot(AuctionIngotSettleRequest) returns (AuctionIngotSettleResponse);
  // P1-5c1：商城的第一道闸门。清单外的商品拒绝，清单内的也还没接发货，两条路都不扣元宝。
  rpc BuyShopItem(BuyShopItemRequest) returns (BuyShopItemResponse);
  // P1-5c3：在战斗里用掉一张符。战斗服发过来，只扣一张、不碰生命与蓝量——
  // 战斗态在战斗进程里，角色服只负责背包的这一次扣减。回复值与冷却在回包里带回去。
  rpc ConsumeTalisman(ConsumeTalismanRequest) returns (ConsumeTalismanResponse);
  // P1-5c5：用符之前的只读查询。这个编号是哪种符、回复落在哪个池，只有角色服
  // 读配置说了算；战斗服不解析配置文件、不自己记编号映射。不扣符、不写库。
  rpc DescribeTalisman(DescribeTalismanRequest) returns (DescribeTalismanResponse);
  // P1-5c6：用复活卷轴之前的只读查询。编号是不是卷轴、冷却到没到、背包有几张，
  // 只有角色服读配置与角色库说了算；战斗服不解析配置、不自己记冷却。不写库。
  rpc DescribeReviveScroll(DescribeReviveScrollRequest) returns (DescribeReviveScrollResponse);
  // P1-5c6：真用掉一张卷轴。战斗服发过来，角色服在一笔事务里扣一张、
  // 只扣当前等级已有经验的一部分、写下跨场保留的冷却到期；不碰生命与蓝量。
  rpc ConsumeReviveScroll(ConsumeReviveScrollRequest) returns (ConsumeReviveScrollResponse);
  // P1-5c7：用掉一张限时经验道具。网关转过来，角色服在一笔事务里扣一张、
  // 把「剩余时间」的到期时刻刷成 now() + 配置时长；库里一个角色最多一行，
  // 再用一张只刷新、不叠倍率。时长与倍率全在配置，请求里带不进来。
  rpc UseExpBooster(UseExpBoosterRequest) returns (UseExpBoosterResponse);
  // P1-5c8：用掉几张解绑道具，把一件已绑定的装备改成可交易。网关转过来，
  // 角色服在一笔事务里认装备 / 认已绑、按 now() - bound_at 算年龄、按配置算张数、
  // 扣掉那几张，再把 inventory 的 bound 改回 false。不新建表、不存第二份状态。
  rpc UseUnbindItem(UseUnbindItemRequest) returns (UseUnbindItemResponse);
  // P1-5d：内部充值订单。P0 不接真实支付渠道，订单与回调都在本服务；
  // 一笔订单只发一次元宝，同一笔回调重复到达整笔不做。
  rpc CreateRechargeOrder(CreateRechargeOrderRequest) returns (CreateRechargeOrderResponse);
  rpc SettleRechargeOrder(SettleRechargeOrderRequest) returns (SettleRechargeOrderResponse);
}

message SettleExpRequest {
  // 网关转发时填令牌账号，where 里再核一次归属；战斗服服间直连时为空，
  // 只按 character_id 找角色。客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 幂等号：一场通关一个号，同一号只发一次。
  string txn_id = 3;
  // 只记账，不参与数值：dungeon / activity / task / arena ...
  string source = 4;
  // 同一场的进本人数，与战斗服连接、角色服进本用的是同一个数字。
  uint32 party_size = 5;
}

message SettleExpResponse {
  // true 表示这个号已经发过，本次一笔没发。
  bool duplicate = 1;
  // 这一笔的基础经验；只有基础经验时 party_bonus 是 0。
  int64 base_exp = 2;
  int64 party_bonus = 3;
  int64 exp_gain = 4;
  int32 level_before = 5;
  int32 level = 6;
  // 当前等级还剩下的经验。
  int64 exp = 7;
  // 方案写定 100，到此后等级不再提高。
  int32 level_cap = 8;
  bool at_cap = 9;
  uint32 party_size = 10;
  string source = 11;
  // P1-5c7：这一笔生效的道具倍率（100 是原倍率）与它额外带来的经验。
  // 都是只读结果，客户端与战斗服都带不进来；判定在角色服用库里的到期时刻做。
  uint32 booster_pct = 12;
  int64 booster_exp = 13;
}

message UseHotSpringRequest {
  string account = 1;
  uint64 character_id = 2;
}

message UseHotSpringResponse {
  // 使用前的当日有效疲劳（跨天归零后按 0 算）。
  int32 fatigue_before = 1;
  // 实际恢复量：不超过配置值，也不超过当日已用疲劳。
  int32 recovered = 2;
  // 使用后的当日已用疲劳，永不为负。
  int32 fatigue = 3;
  int32 fatigue_daily_cap = 4;
  // 配置里的单次恢复量，回给客户端，不让它自己另算一套。
  int32 recovery_limit = 5;
  int32 weekly_share = 6;
}

message EnterDungeonRequest {
  string account = 1;
  uint64 character_id = 2;
  string dungeon_id = 3;
  // 这次一起进本的人数。主线必须是 1。
  uint32 party_size = 4;
}

message EnterDungeonResponse {
  // true 表示允许进本，false 表示被拒（reason 里给原因）。
  bool allowed = 1;
  string reason = 2;
  uint32 max_players = 3;
  // 进本之后这个角色的疲劳与周份额。主线这两种都不动。
  int32 fatigue = 4;
  int32 weekly_share = 5;
  uint64 entry_id = 6;
  // 这一次要扣多少疲劳（深渊 = 单人基础 × 进本人数，主线与巢穴 = 0），被拒时为 0。
  int32 fatigue_cost = 7;
  // 当天的疲劳上限，配置来自 config/dungeons.json。
  int32 fatigue_daily_cap = 8;
  // 这一次扣掉多少周份额（巢穴 = 进本人数，主线与深渊 = 0），被拒时为 0。
  int32 weekly_share_cost = 9;
  // 这一周还剩多少个单人份（方案写定每周 12 个）。
  int32 weekly_share_remaining = 10;
  // 一周的总份额，配置来自 config/dungeons.json。
  int32 weekly_share_cap = 11;
  // 本次应得的单人产出份数：单人通关产出 × 进本人数；主线与深渊为 0。
  // 实物种类与数量属掉落表，在后面的卡发放。
  int32 reward_shares = 12;
}

// 一条变更：加/减货币，或者往格子里放物品。一个事务里可以混着来。
message GrantEntry {
  oneof body {
    CurrencyDelta currency = 1;
    ItemDelta item = 2;
  }
}

message CurrencyDelta {
  string kind = 1;
  // 可正可负；扣成负数整笔不做。
  int64 delta = 2;
}

message ItemDelta {
  uint32 slot = 1;
  string item_id = 2;
  int32 count = 3;
}

message ApplyGrantRequest {
  string account = 1;
  uint64 character_id = 2;
  // 客户端给的唯一号。同一个号只能发一次奖。
  string txn_id = 3;
  repeated GrantEntry entries = 4;
}

message ApplyGrantResponse {
  // true 表示这个号已经用过了，这一笔没有执行。
  bool duplicate = 1;
  repeated CurrencyBalance balances = 2;
  repeated InventorySlot slots = 3;
}

message AddCurrencyRequest {
  string account = 1;
  uint64 character_id = 2;
  // gold / stone_1..stone_5 / yuanbao
  string kind = 3;
  int64 delta = 4;
}

message CurrencyBalance {
  string kind = 1;
  int64 amount = 2;
}

message GetCurrencyRequest {
  string account = 1;
  uint64 character_id = 2;
}

message GetCurrencyResponse {
  repeated CurrencyBalance balances = 1;
}


message SetLevelRequest {
  string account = 1;
  uint64 character_id = 2;
  int32 level = 3;
}

message SetLevelResponse {
  uint64 character_id = 1;
  int32 level = 2;
}

message AddItemRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  string item_id = 4;
  int32 count = 5;
}

message InventorySlot {
  uint32 slot = 1;
  string item_id = 2;
  int32 count = 3;
  bool bound = 4;
}

message ListInventoryRequest {
  string account = 1;
  uint64 character_id = 2;
}

message ListInventoryResponse {
  repeated InventorySlot slots = 1;
  uint32 bag_slots = 2;
  // 只读：角色服从角色表读出的名字，供表世界「再远只留名字」的名字牌使用。
  // 网关复核归属时取，客户端不能通过请求体改它。
  string character_name = 3;
  // 只读：角色表当前的境界。世界服判飞行与跨区时来问，只在这一段服与服之间传，
  // 客户端请求体带不进，也没有任何写入接口（突破在后面的卡）。
  string realm = 4;
}

message CanTradeRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
}

message CanTradeResponse {
  bool tradable = 1;
  // tradable=false 时给原因：bound_item / slot_empty
  string reason = 2;
}

// 强化一次装备。只带要强化的格子和用哪种石头；目标等级由角色服从库里读出的
// 当前等级 +1 算，档位、材料、消耗与成功率都由角色服按配置决定。
// txn_id 由网关生成（客户端填不进来），同一笔不会扣两次材料。
message EnhanceRequest {
  // 网关转发时填令牌账号，角色服再核一次归属。
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  string stone_id = 4;
  string txn_id = 5;
  // 这一手用不用保护券。只带这个开关：券编号、数量、来源、成功率、等级、
  // 结果与余额都带不进来，也不存在「必成券」这种东西。
  bool use_coupon = 6;
}

message EnhanceResponse {
  // 业务前提不满足（wrong_stone / at_cap / insufficient ...）是正常回包里的
  // ok=false + reason，不是 gRPC 错误码；身份与参数错才走错误码。
  bool ok = 1;
  string reason = 2;
  int32 level_before = 3;
  int32 level = 4;
  // 配置里的上限，回给客户端，不让它自己另算一套。
  int32 max_level = 5;
  bool success = 6;
  // 只作展示：low / mid / high，客户端不拿它算数值。
  string tier = 7;
  string required_stone = 8;
  int32 stone_cost = 9;
  int64 gold_cost = 10;
  int64 gold = 11;
  int32 stone_left = 12;
  // 同一个事务号再提交：一笔没做。
  bool duplicate = 13;
  // 只作展示：这一档从 config/enhance.json 读出的成功率。带券与不带券是同一个数，
  // 券不提高成功率；客户端不拿它算数值，也不参与请求。
  double success_rate = 14;
  // 这一手失败，但掉级被保护券挡住了（等级 = level_before）。
  bool protected_level = 15;
  // 这一手实际用掉几张券：只在「真的挡下一次掉级」时是 1，成功或没用券都是 0。
  int32 coupon_used = 16;
  // 只作展示：背包里还剩几张这种券。
  int32 coupon_left = 17;
}

// 把强化等级从来源格转到目标格。只带两个格子：
// 两格等级、绑定、转移石编号 / 张数、金币费用、结果与事务号都带不进来。
message TransferEnhanceRequest {
  // 网关转发时填令牌账号，角色服再核一次归属。
  string account = 1;
  uint64 character_id = 2;
  uint32 from_slot = 3;
  uint32 to_slot = 4;
  string txn_id = 5;
}

message TransferEnhanceResponse {
  // 业务前提不满足（source_not_higher / slot_empty / not_equipment /
  // stone_insufficient / gold_insufficient ...）是正常回包里的 ok=false + reason，
  // 不是 gRPC 错误码；身份与参数错才走错误码。未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  int32 from_level_before = 3;
  int32 to_level_before = 4;
  int32 from_level = 5;
  int32 to_level = 6;
  // 配置里的强化上限，回给客户端，不让它自己另算一套。
  int32 max_level = 7;
  // 只作展示：这一手实际扣的金币与转移石。客户端不拿它们算结果。
  int64 gold_cost = 8;
  int64 gold = 9;
  string stone_item = 10;
  int32 stone_cost = 11;
  int32 stone_left = 12;
  // 只作展示：目标格转移前后的绑定状态。来源绑定时目标会变成绑定。
  bool target_bound_before = 13;
  bool target_bound = 14;
  // 同一个事务号再提交：一笔没做。
  bool duplicate = 15;
}

// 能量结晶装上（方案第 9 章第 3 层）。只带三个格位编号：
// 结晶类别、装备部位、固定值、能不能装、结果和事务号都带不进来。
message InstallCrystalRequest {
  // 网关转发时填令牌账号，角色服再核一次归属。
  string account = 1;
  uint64 character_id = 2;
  // 要装结晶的装备格。
  uint32 slot = 3;
  // 结晶现在放在背包的哪一格。服务端自己读这一格的物品编号。
  uint32 crystal_slot = 4;
  // 装到第几个镶嵌位。位数与合法范围由配置决定。
  uint32 socket = 5;
  string txn_id = 6;
}

// 拆下：只带装备格与镶嵌位，拆下来的结晶由角色服放回背包。
message RemoveCrystalRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  uint32 socket = 4;
  string txn_id = 5;
}

message CrystalResponse {
  // 业务前提不满足（wrong_part / not_crystal / socket_occupied / socket_empty ...）
  // 是正常回包里的 ok=false + reason，不是 gRPC 错误码；身份与参数错才走错误码。
  // 未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  // 结果态：true 装上了、false 拆下了。客户端不拿它算数值。
  bool installed = 3;
  uint32 slot = 4;
  uint32 socket = 5;
  string crystal_item = 6;
  // 只作展示：类别与部位只在服务端从配置读，客户端不另算一套。
  string category = 7;
  string part = 8;
  // 配置里的镶嵌位数量，回给客户端，不让它自己另算。
  int32 socket_count = 9;
  int32 filled_before = 10;
  int32 filled = 11;
  int32 crystal_left = 12;
  // 只作展示：装上 / 拆下都不改金币、强化等级和绑定，回出来给核对看。
  int64 gold = 13;
  int32 enhance_level = 14;
  bool bound = 15;
  // 同一个事务号再提交：一笔没做。
  bool duplicate = 16;
}

// 拍卖成交结算。全局服务转发时只带买方角色、挂单号与事务号：
// 标价、卖方、物品编号、绑定、税率、税额、到账与结果都由角色服从库和
// config/auction.json 读，多传这些字段也不会被反序列化进请求。
message AuctionSettleRequest {
  string account = 1;
  uint64 character_id = 2;
  uint64 listing_id = 3;
  string txn_id = 4;
}

message AuctionSettleResponse {
  // listing_not_found / listing_sold / same_character / bound_item /
  // item_missing / bag_full / gold_insufficient 等业务前提是 ok=false + reason，
  // 不是 gRPC 错误码；未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  uint64 listing_id = 3;
  int64 price_gold = 4;
  // 从买方标价里销毁的那一部分，不写进任何角色或系统账户。
  int64 tax_gold = 5;
  int64 net_gold = 6;
  int64 buyer_gold = 7;
  int64 seller_gold = 8;
  int32 tax_rate_pct = 9;
  string item_id = 10;
  uint32 count = 11;
  string state = 12;
  bool duplicate = 13;
}

// 元宝寄售成交结算。全局服务转发时只带买方角色、挂单号与事务号：
// 标价、卖方、元宝币种、税率、税额、到账与结果都由角色服从库和
// config/auction.json 读，多传这些字段也不会被反序列化进请求。
message AuctionIngotSettleRequest {
  string account = 1;
  uint64 character_id = 2;
  uint64 listing_id = 3;
  string txn_id = 4;
}

message AuctionIngotSettleResponse {
  // listing_not_found / listing_sold / same_character / gold_insufficient /
  // ingot_insufficient 等业务前提是 ok=false + reason，不是 gRPC 错误码；
  // 未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  uint64 listing_id = 3;
  int64 ingot_amount = 4;
  int64 price_gold = 5;
  // 从买方标价里销毁的那一部分，不写进任何角色或系统账户。
  int64 tax_gold = 6;
  int64 net_gold = 7;
  int64 buyer_gold = 8;
  int64 seller_gold = 9;
  // 元宝等量转移：卖方 -ingot_amount、买方 +ingot_amount，全库总量不变。
  int64 buyer_ingot = 10;
  int64 seller_ingot = 11;
  int32 tax_rate_pct = 12;
  string state = 13;
  bool duplicate = 14;
}

message BuyShopItemRequest {
  // 网关转发时填令牌账号；客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 只带商品编号。标价、数量、发货种类、绑定态都由服务端按清单与配置来，
  // 客户端一个都带不进来。
  string item_id = 3;
  // 网关生成的幂等号。这张卡不写库，编号只进日志与回包，便于核对同一笔请求。
  string txn_id = 4;
}

message BuyShopItemResponse {
  bool ok = 1;
  // not_in_list（清单外）/ delivery_pending（清单内但还没接发货）/
  // not_enough_yuanbao（元宝不够）/ bag_full（背包满）/ 空串表示真的发出去了。
  string reason = 2;
  string item_id = 3;
  string kind = 4;
  string name = 5;
  // 清单里的标价。清单外时为 0：未生效的数值一律给 0，不拿别的数顶。
  int64 price_yuanbao = 6;
  string currency = 7;
  // 元宝余额，从角色服读出来的事实值，不是算出来的。成交时是这一笔之后的余额。
  int64 balance = 8;
  // 够不够买。清单外为 false。
  bool enough = 9;
  // 这一笔真扣掉的元宝。没成交恒为 0——未生效的数值一律给 0。
  int64 charged_yuanbao = 10;
  // 东西有没有真进背包。没成交恒为 false。
  bool delivered = 11;
  string state = 12;
  // 发到包里的物品编号。没接发货、没成交时为空串。
  string delivery_item_id = 13;
  // 落在背包第几格。没落包时为 0。
  uint32 bag_slot = 14;
  // 到账即绑：商城卖的券与符都是绑定物，这张卡发的保护券恒为 true。
  bool bound = 15;
  // 同一个事务号重复提交时为 true：整笔不做，余额与背包都不动。
  bool duplicate = 16;
}

// 回复落在哪个池。方案 12.1：红符只回生命、蓝符只回蓝量，两者互不越界。
// 这是协议层的枚举，不是配置数值；具体回多少由 config/talisman.json 给。
enum TalismanPool {
  TALISMAN_POOL_UNSPECIFIED = 0;
  TALISMAN_POOL_HP = 1;
  TALISMAN_POOL_MANA = 2;
}

message ConsumeTalismanRequest {
  // 战斗服服间直连时为空，只按 character_id 找角色；客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 只带物品编号。数量恒为 1，回复值与冷却都不在请求里——客户端一个都带不进来，
  // 也就能改不了「这一张回多少血」。
  string item_id = 3;
  // 战斗服生成的幂等号：同一个号只扣一张，重放整笔不做。
  string txn_id = 4;
}

message ConsumeTalismanResponse {
  bool ok = 1;
  // not_talisman（不是符）/ no_talisman（背包里没有这张）/ 空串表示真扣掉了。
  string reason = 2;
  string item_id = 3;
  // 扣掉之后背包里还剩几张。没扣时给的是当前张数（事实值，不是算出来的）。
  int64 count_left = 4;
  // 扣的是哪一格。没扣时为 0。
  uint32 slot = 5;
  // 同一个号重放：这一笔没执行，张数不动。
  bool duplicate = 6;
  // 配置里的回复值。战斗服照着这个加，不自己写第二套数。
  // 红符只有 hp_restore，蓝符只有 mana_restore，另一个恒 0——不回血就是在这里落死的。
  int64 hp_restore = 7;
  // 配置里的冷却与冷却组。红符是 heal 组（和红药、牧师治疗共用），
  // 蓝符是 mana 组（和蓝药共用），两组互不占用。
  uint32 cooldown_ms = 8;
  string cooldown_group = 9;
  // 这一张回复落在哪个池。战斗服据此决定加到血还是蓝，不按物品编号自己猜。
  TalismanPool pool = 10;
  // 蓝符的回复值；红符恒 0。
  int64 mana_restore = 11;
}

// 用符之前的只读查询。请求里只有编号，没有数量、回复值或冷却——
// 客户端/战斗服都带不进来服务端的数。
message DescribeTalismanRequest {
  uint64 character_id = 1;
  string item_id = 2;
}

message DescribeTalismanResponse {
  bool ok = 1;
  // not_talisman（不是符）/ upstream_off（角色服没连上）/ 空串表示查到了。
  string reason = 2;
  string item_id = 3;
  // 查到了才有意义：这一张回复落在哪个池。
  TalismanPool pool = 4;
  // 只读的背包张数，事实值；真正扣不扣由 ConsumeTalisman 那笔事务再判一次。
  int64 count_left = 5;
}

// P1-5c6：用卷轴之前的只读查询。请求里只有角色号与物品编号，没有目标、
// 数量、回复值或冷却——「只拉起自己」在协议结构上就落死了。
message DescribeReviveScrollRequest {
  uint64 character_id = 1;
  string item_id = 2;
}

message DescribeReviveScrollResponse {
  bool ok = 1;
  // not_scroll（编号不对）/ character_not_found / 空串表示查到了。
  string reason = 2;
  string item_id = 3;
  // 背包里还有几张（只读事实值）；真正扣不扣由 ConsumeReviveScroll 的事务再判。
  int64 count_left = 4;
  // 配置里的冷却时长与拉起血量比例、一转基础经验比例。战斗服不写第二套数。
  uint32 cooldown_ms = 5;
  uint32 hp_restore_pct = 6;
  uint32 exp_cost_pct = 7;
  // 角色库里那个人的冷却到期时刻（Unix 毫秒），没用过给 0。跨场保留靠这一列。
  int64 ready_at_ms = 8;
  // 角色服当前时刻（Unix 毫秒）：战斗服拿它和 ready_at_ms 比，不用两边对表。
  int64 now_ms = 9;
  int64 level = 10;
  int64 exp = 11;
}

// P1-5c6：真扣一张卷轴。请求里只有标识，没有任何服务端数值：
// 比例、冷却、扣多少经验全由角色服按 config 与库里的当前级经验算。
message ConsumeReviveScrollRequest {
  // 网关转发时填令牌账号；战斗服服间直连时为空，只按角色号找角色。
  string account = 1;
  uint64 character_id = 2;
  string item_id = 3;
  // 战斗服生成的幂等号：同一个号只扣一张，重放整笔不做。
  string txn_id = 4;
}

message ConsumeReviveScrollResponse {
  bool ok = 1;
  // cooldown / no_scroll / not_scroll / duplicate / character_not_found /
  // server_error / 空串表示真扣掉了。
  string reason = 2;
  string item_id = 3;
  // 扣掉之后背包里还剩几张。没扣时给的是当前张数（事实值）。
  int64 count_left = 4;
  // 拉起按这个比例回到一小段生命（< 100，不满血）；战斗服照着算，不自己写数。
  uint32 hp_restore_pct = 5;
  // 实际扣掉的当前级经验。当前级经验是零时这里是 0，等级不变、不掉级。
  int64 exp_cost = 6;
  int64 level = 7;
  int64 exp_after = 8;
  // 这一张写进角色库的冷却到期时刻（Unix 毫秒），换一场仍读得到。
  int64 ready_at_ms = 9;
  uint32 cooldown_ms = 10;
  // 同一个事务号重放：整笔没执行，卷轴、经验、冷却都不动。
  bool duplicate = 11;
}

// P1-5c7：用掉一张限时经验道具。请求里只有标识与物品编号，
// 时长、倍率、到期时刻、张数一个都带不进来，全由角色服从配置与角色库读。
message UseExpBoosterRequest {
  // 网关转发时填令牌账号；服间可信调用为空，只按角色编号找角色。
  string account = 1;
  uint64 character_id = 2;
  string item_id = 3;
  // 网关生成的幂等号：同一个号只扣一张，重放整笔不做。
  string txn_id = 4;
}

message UseExpBoosterResponse {
  bool ok = 1;
  // not_booster / no_booster / character_not_found / duplicate / 空串表示真用掉了。
  string reason = 2;
  string item_id = 3;
  // 扣掉之后背包里还剩几张；没扣时给的是当前张数（事实值）。
  int64 count_left = 4;
  // 配置里的一段时长与结算倍率，只作回包事实值，生效判定不在这里。
  uint32 duration_ms = 5;
  uint32 gain_pct = 6;
  // 写进角色库的到期时刻与库当前时刻（Unix 毫秒）；剩余时间就是两者之差。
  // 再用一张只刷新同一行的 expires_at，不累加、也不新增第二行。
  int64 expires_at_ms = 7;
  int64 now_ms = 8;
  bool duplicate = 9;
}

// P1-5c8：用掉解绑道具。请求里只有标识与格子；张数、档位、绑定年龄全由角色服
// 从配置与角色库读，客户端一个都带不进来。
message UseUnbindItemRequest {
  // 网关转发时填令牌账号；服间可信调用为空，只按角色编号找角色。
  string account = 1;
  uint64 character_id = 2;
  // 要解绑的那一格，不是解绑道具自己那一格。
  int32 slot = 3;
  string item_id = 4;
  // 网关生成的幂等号：同一个号只扣一次，重放整笔不做。
  string txn_id = 5;
}

message UseUnbindItemResponse {
  bool ok = 1;
  // 空串表示真解开了；not_equipment / not_bound / slot_empty / no_unbind_item /
  // not_enough_unbind / character_not_found / duplicate 表示整笔没做。
  string reason = 2;
  string item_id = 3;
  int32 slot = 4;
  // 被解绑的装备编号（事实值）；拒绝时也给，便于核对。
  string target_item_id = 5;
  // 这一次实际用掉几张（成功时等于配置算出来的数）；拒绝时为 0。
  uint32 cost = 6;
  // 扣掉之后解绑道具还剩几张；拒绝时给当前张数（事实值）。
  int64 count_left = 7;
  // 这一格绑了多久（小时，数据库时钟算），只作事实值，判定在角色服那一笔事务里。
  int64 age_hours = 8;
  // 是否已经到配置下限（绑得最久那一档）。
  bool floor_hit = 9;
}

// P1-5d：建一张内部充值订单。客户端只带商品编号，元宝数由服务端按配置决定；
// 订单号由服务端生成。
message CreateRechargeOrderRequest {
  string account = 1;
  uint64 character_id = 2;
  string product_id = 3;
}

message CreateRechargeOrderResponse {
  bool ok = 1;
  // product_not_found / character_not_found / request_missing；空串表示建好了。
  string reason = 2;
  string order_id = 3;
  string product_id = 4;
  int64 yuanbao = 5;
  // 建单后恒为 pending。
  string status = 6;
}

// P1-5d：结算一笔内部订单（P0 用它模拟支付渠道回调）。同一笔重复调用只发一次。
message SettleRechargeOrderRequest {
  // 网关转发时填令牌账号；结算会核这张订单是不是这个账号的。
  string account = 1;
  string order_id = 2;
}

message SettleRechargeOrderResponse {
  bool ok = 1;
  // order_not_found / duplicate；空串表示这一笔真发了元宝。
  string reason = 2;
  string order_id = 3;
  string status = 4;
  // 这一笔发了多少元宝（duplicate 时也给订单上的数，便于核对）。
  int64 yuanbao = 5;
  // 结算后的元宝余额（事实值）。
  int64 balance = 6;
  int64 paid_at_ms = 7;
  bool duplicate = 8;
}
