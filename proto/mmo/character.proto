syntax = "proto3";

package mmo.character;

option csharp_namespace = "Mmo.Proto.Character";

// 创建一个角色。字段按技术架构第 6 节「角色主数据」：
// 种族只影响外观与出身对白，不带属性、不锁职业，所以这里只有编号与外观；
// 主线场次与立仙或立魔在创建时为空，不放进请求，直接由服务端落成空。
message CreateCharacterRequest {
  string account = 1;
  string name = 2;
  // 出身编号，四种之一。只决定外观默认值与对白，不带数值。
  string race = 3;
  // 外观选择，JSON 串。只影响样子，服务端不解析成属性。
  string appearance = 4;
  // warrior / archer / mage / priest / tank
  string class_id = 5;
  // 一转分支，可以不填。填了必须与职业对得上。
  string branch = 6;
}

message CreateCharacterResponse {
  uint64 character_id = 1;
  string name = 2;
  string race = 3;
  string appearance = 4;
  string class_id = 5;
  string branch = 6;
  int32 level = 7;
  string realm = 8;
  // 建好之后这两项必须是空的，客户端据此知道还没进主线、还没分路。
  bool main_stage_empty = 9;
  bool alignment_empty = 10;
}

// Q12/K3：改名。改一次消耗一张改名卡（物品编号在 config/name_rules.json 的
// rename_item_id），卡在角色服那笔事务里扣，客户端说了不算。
// txn_id 由网关生成：同一个号重放只回 duplicate，不会二次扣卡。
message RenameCharacterRequest {
  // 网关填账号并先核归属；战斗服 / 探针直连时留空，只按角色号找。
  string account = 1;
  uint64 character_id = 2;
  string new_name = 3;
  string txn_id = 4;
}

message RenameCharacterResponse {
  bool ok = 1;
  // 拒绝码：name_too_short / name_too_long / name_banned / name_invalid /
  // name_taken / name_unchanged / rename_card_missing / rename_disabled /
  // character_not_found / duplicate。
  string reason = 2;
  // 改成功后的显示名；失败时是改名前的名字。
  string name = 3;
  // 这一次用的是哪件物品（改名卡编号）。
  string item_id = 4;
  // 改完之后背包里还剩几张；没扣卡时是 0。
  int32 count_left = 5;
  // 同一个 txn_id 重放时为 true，此时没有扣卡、名字没变。
  bool duplicate = 6;
}

// 角色服。角色的唯一写入在这里，网关只能转请求，不能直接写库。
service CharacterService {
  rpc CreateCharacter(CreateCharacterRequest) returns (CreateCharacterResponse);

  // Q12/K3：改名。名字在全服跨账号唯一；旧名在同一笔事务里释放。
  rpc RenameCharacter(RenameCharacterRequest) returns (RenameCharacterResponse);

  // 写等级。1–100 可写，超过 100 或小于 1 直接拒绝，不改库里的值。
  // 上限是大版本也不抬的（方案「成长与物品」），所以拒绝而不是夹到 100。
  rpc SetLevel(SetLevelRequest) returns (SetLevelResponse);

  // 背包：往一个格子里放东西。绑定规则由物品表决定，客户端说了不算。
  rpc AddItem(AddItemRequest) returns (InventorySlot);

  // 读回整个背包。这一行只给核对与后续行用，不做界面。
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);

  // 这一格的物品能不能直接交易。绑定物品返回不可交易，原因 bound_item。
  // 交易本身在 P1-5a，这里只给判定。
  rpc CanTrade(CanTradeRequest) returns (CanTradeResponse);

  // 货币加减。delta 可正可负，一条语句原子完成；结果小于 0 直接拒绝（insufficient）。
  rpc AddCurrency(AddCurrencyRequest) returns (CurrencyBalance);

  // 读回全部币种，没有记账的按 0 算。
  rpc GetCurrency(GetCurrencyRequest) returns (GetCurrencyResponse);

  // 发一笔奖：事务号 + 若干条变更，整笔在一个数据库事务里，全成或全退。
  // 同一个事务号再提交不会发第二次，响应里 duplicate=true。
  rpc ApplyGrant(ApplyGrantRequest) returns (ApplyGrantResponse);

  // 进本。主线只允许 1 人、不扣疲劳不占周份额；深渊按人数扣疲劳；
  // 巢穴按人数占周份额、按人数记产出份数。
  // 人数与扣减规则都从 config/dungeons.json 来，不在代码里写死。
  rpc EnterDungeon(EnterDungeonRequest) returns (EnterDungeonResponse);

  // Q8/H2：战斗服结算前读一次的分配口径（队伍事实 + loot 规则）。
  // 只读，不写库、不改队伍；社交服不可达时回 personal（默认口径）。
  rpc DescribeLootScope(DescribeLootScopeRequest) returns (DescribeLootScopeResponse);

  // 温泉。只把当日已用疲劳减回配置里的 hot_spring_recovery（方案写定 1500），
  // 不动周份额、进本记录、货币、背包和等级。减到 0 为止，不写成负数。
  rpc UseHotSpring(UseHotSpringRequest) returns (UseHotSpringResponse);

  // 等级经验结算。活动、副本、任务、竞技场、战场、城战和世界 Boss 都走这一笔；
  // 同一场至少两个人时这一笔多一截少量加成，只加经验。
  // 请求里没有经验数值，基础值、加成幅度与升级曲线全在 config/exp.json。
  // 同一个 txn_id 再提交不发第二次。
  rpc SettleExp(SettleExpRequest) returns (SettleExpResponse);

  // 强化。三档材料、成功率、金币与石头消耗全在 config/enhance.json，只在角色服判定。
  // 请求里没有等级、成功率、结果和账号余额，客户端说了不算；
  // 扣石头、扣金币、改强化等级在同一笔数据库事务里，失败只掉 1 级。
  // P1-4b：use_coupon 只表示「这一手要不要用背包里的保护券」，券只挡掉级，
  // 不改这一档的成功率；券的编号、数量、来源都不在请求里。
  rpc Enhance(EnhanceRequest) returns (EnhanceResponse);

  // 强化转移（方案 9.3）。请求里只有两个格子：两格强化等级、绑定状态、
  // 转移石编号与张数、金币费用都从角色服的库与 config/transfer.json 读。
  // 来源必须高于目标，成功后来源 +0、目标覆盖为来源原来的等级，
  // 来源绑定时目标在同一笔事务里改为绑定。转移必定成功，不掷点。
  // txn_id 由网关生成，客户端填不进来。
  rpc TransferEnhance(TransferEnhanceRequest) returns (TransferEnhanceResponse);
  // 能量结晶（方案第 9 章第 3 层）：装上与拆下各一次角色服事务，共用同一种回包。
  rpc InstallCrystal(InstallCrystalRequest) returns (CrystalResponse);
  rpc RemoveCrystal(RemoveCrystalRequest) returns (CrystalResponse);

  // 拍卖成交结算（方案第 12 章、开发架构第 14 节第 39 行）。全局服务转过来，
  // 角色服在一笔事务里写买方金币、卖方净额、物品交付与成交状态；
  // 标价、卖方、物品、税率与税额全在服务端读，客户端一个都带不进来。
  rpc SettleAuction(AuctionSettleRequest) returns (AuctionSettleResponse);

  // B5 摆摊（开发架构 14.5 顺序 12）。摊位在世界服显示，开摊 / 关摊 / 上架 / 查看
  // 这四件事落在角色服：等级门槛、格数、摊位归属与「在售几件」只有角色服有。
  // 成交不另开一笔，仍走上面的 SettleAuction（同一套 auction_txn / auction_settlement），
  // 税按挂单的 channel 取 config/stall.json（摆摊）或 config/auction.json（拍卖）。
  rpc OpenStall(OpenStallRequest) returns (OpenStallResponse);
  rpc CloseStall(CloseStallRequest) returns (CloseStallResponse);
  rpc ListStallItem(ListStallItemRequest) returns (ListStallItemResponse);
  rpc ViewStall(ViewStallRequest) returns (ViewStallResponse);

  // 元宝寄售成交结算（开发架构第 14 节第 40 行）。全局服务转过来，
  // 角色服在一笔事务里写买方金币、卖方净额、双方元宝与成交状态；
  // 标价、卖方、元宝币种、税率与税额全在服务端读，客户端一个都带不进来。
  rpc SettleIngot(AuctionIngotSettleRequest) returns (AuctionIngotSettleResponse);
  // P1-5c1：商城的第一道闸门。清单外的商品拒绝，清单内的也还没接发货，两条路都不扣元宝。
  rpc BuyShopItem(BuyShopItemRequest) returns (BuyShopItemResponse);
  // N11：家园币商城。只许外观与便捷，清单与标价在 config/home_coin_shop.json。
  rpc BuyHomeCoinShopItem(BuyHomeCoinShopRequest) returns (BuyHomeCoinShopResponse);
  // K2+Q13：NPC 商店。一个面板四件事——看货架、买、卖、回购、修理。
  // 商品、价格、库存、限购、回收价、回购窗口、耐久上限与修理单价全在
  // config/npc_shop.json；客户端只带商店编号、格号与事务号，带不进价格。
  rpc DescribeNpcShop(DescribeNpcShopRequest) returns (DescribeNpcShopResponse);
  rpc BuyNpcShopItem(BuyNpcShopItemRequest) returns (BuyNpcShopItemResponse);
  rpc SellNpcItem(SellNpcItemRequest) returns (SellNpcItemResponse);
  rpc BuybackNpcItem(BuybackNpcItemRequest) returns (BuybackNpcItemResponse);
  rpc RepairNpcEquipment(RepairNpcEquipmentRequest) returns (RepairNpcEquipmentResponse);
  // P1-5c3：在战斗里用掉一张符。战斗服发过来，只扣一张、不碰生命与蓝量——
  // 战斗态在战斗进程里，角色服只负责背包的这一次扣减。回复值与冷却在回包里带回去。
  rpc ConsumeTalisman(ConsumeTalismanRequest) returns (ConsumeTalismanResponse);
  // P1-5c5：用符之前的只读查询。这个编号是哪种符、回复落在哪个池，只有角色服
  // 读配置说了算；战斗服不解析配置文件、不自己记编号映射。不扣符、不写库。
  rpc DescribeTalisman(DescribeTalismanRequest) returns (DescribeTalismanResponse);
  // B1：丹药。和符同一种切法——编号到回复池的映射只在角色服的 config/pill.json，
  // 战斗服不解析配置、不自己记一份。Describe 只读，Consume 才扣背包一格。
  rpc DescribePill(DescribePillRequest) returns (DescribePillResponse);
  // B1：在战斗里吃一颗丹。只扣一颗、不碰生命与蓝量；回复值与冷却由回包带给战斗服。
  rpc ConsumePill(ConsumePillRequest) returns (ConsumePillResponse);
  // P1-5c6：用复活卷轴之前的只读查询。编号是不是卷轴、冷却到没到、背包有几张，
  // 只有角色服读配置与角色库说了算；战斗服不解析配置、不自己记冷却。不写库。
  rpc DescribeReviveScroll(DescribeReviveScrollRequest) returns (DescribeReviveScrollResponse);
  // P1-5c6：真用掉一张卷轴。战斗服发过来，角色服在一笔事务里扣一张、
  // 只扣当前等级已有经验的一部分、写下跨场保留的冷却到期；不碰生命与蓝量。
  rpc ConsumeReviveScroll(ConsumeReviveScrollRequest) returns (ConsumeReviveScrollResponse);
  // P1-5c7：用掉一张限时经验道具。网关转过来，角色服在一笔事务里扣一张、
  // 把「剩余时间」的到期时刻刷成 now() + 配置时长；库里一个角色最多一行，
  // 再用一张只刷新、不叠倍率。时长与倍率全在配置，请求里带不进来。
  rpc UseExpBooster(UseExpBoosterRequest) returns (UseExpBoosterResponse);
  // P1-5c8：用掉几张解绑道具，把一件已绑定的装备改成可交易。网关转过来，
  // 角色服在一笔事务里认装备 / 认已绑、按 now() - bound_at 算年龄、按配置算张数、
  // 扣掉那几张，再把 inventory 的 bound 改回 false。不新建表、不存第二份状态。
  rpc UseUnbindItem(UseUnbindItemRequest) returns (UseUnbindItemResponse);
  // P1-5d：内部充值订单。P0 不接真实支付渠道，订单与回调都在本服务；
  // 一笔订单只发一次元宝，同一笔回调重复到达整笔不做。
  rpc CreateRechargeOrder(CreateRechargeOrderRequest) returns (CreateRechargeOrderResponse);
  rpc SettleRechargeOrder(SettleRechargeOrderRequest) returns (SettleRechargeOrderResponse);
  // P2-3b：战场进场前的只读战斗属性快照。只给事实值——职业、分支、等级、
  // 各槽强化等级之和；属性折算、战力与同队平衡全在战斗服按 config/battlefield.json 做。
  // 不写库，也不返回背包、货币与任何客户端能改的输入。
  rpc DescribeBattleProfile(DescribeBattleProfileRequest) returns (DescribeBattleProfileResponse);
  // P2-4a：二转只把 15 级选定的那条分支往前推一步。45 级才允许，目标必须就是
  // 已经选定的那条；改去另一条分支一律拒绝。分支步数写在角色库里，不靠客户端传。
  rpc AdvanceBranch(AdvanceBranchRequest) returns (AdvanceBranchResponse);
  // A9：属性加点。只读这条回手上还剩多少点与四属性各加了多少；写那条一次只加一个属性，
  // 事务号由网关生成、同一个事务号只加一次。点数只在角色服算，战斗服只读快照。
  rpc DescribeAttributePoints(DescribeAttributePointsRequest) returns (DescribeAttributePointsResponse);
  rpc AllocateAttributePoints(AllocateAttributePointsRequest) returns (AllocateAttributePointsResponse);
  // P2-4a：这件装备这个人能不能穿。不到 15 级的武器全职业可装备；
  // 15 级起只能用本职业兵器（职业可用兵器 = 该职业所有分支的本命兵器并集）。
  rpc CanEquip(CanEquipRequest) returns (CanEquipResponse);

  // B6：觉醒。满级后开放（方案 8.2），一个角色只觉醒一次、不可逆、不洗点。
  // 请求只带角色与分支：觉醒技编号由角色服按 config/awaken.json 的分支映射现取，
  // 客户端带不进编号、带不进等级；觉醒不加等级、不推进境界、不另开战斗层。
  rpc Awaken(AwakenRequest) returns (AwakenResponse);
  // B6：这个角色觉醒了没有、觉醒的是哪一条。只读；没觉醒回 skill_id = 0。
  rpc DescribeAwaken(DescribeAwakenRequest) returns (DescribeAwakenResponse);

  // B9：穿上一件装备。请求只给背包格号——部位、等级门槛、职业限制全由角色服从
  // 物品表与库里读，客户端带不进任何数值。背包行不动（不删行、不改格号），
  // 只是新增一条「这个部位穿的是哪一行」；因此强化与结晶仍挂在那口背包行上。
  // 同部位已经穿着一件时回 slot_occupied，不替玩家自动换下。
  rpc EquipItem(EquipItemRequest) returns (EquipItemResponse);

  // B9：脱下一件。按部位脱，脱下后那一格还是原来那一格。
  rpc UnequipItem(UnequipItemRequest) returns (UnequipItemResponse);

  // P3-1a2：突破。请求里只有角色、事务号与网关给的账号；
  // 修为（当前境界）、历练、炼心（主线 + 必要支线）、灵石与成功率全由角色服
  // 从库和 config/realms.json 读。条件不满足时一分都不扣；失败时修为不变，
  // 历练与灵石照扣。
  rpc AdvanceRealm(AdvanceRealmRequest) returns (AdvanceRealmResponse);

  // P3-1a2：历练结算。战斗服通关后发过来，只统计已经能进入的副本；
  // 给多少历练由 config/dungeons.json 的 drill 决定，请求里带不进来。
  // 同一个事务号再提交不会加第二次。
  rpc SettleDrill(SettleDrillRequest) returns (SettleDrillResponse);

  // N10：段内升一阶。等级门槛与被动百分比都在 config/realms.json；客户端不算。
  rpc PromoteRealmPhase(PromoteRealmPhaseRequest) returns (PromoteRealmPhaseResponse);

  // N10：只读当前段内阶与配置里的被动万分比（bps），供战斗服等服间读取。
  rpc DescribeRealmPassive(DescribeRealmPassiveRequest) returns (DescribeRealmPassiveResponse);

  // N12：英灵图鉴收集度与配置里的生活协助被动；不做卡组战斗，客户端不算。
  rpc DescribeHeroCodex(DescribeHeroCodexRequest) returns (DescribeHeroCodexResponse);

  // P3-2a：灵石相邻档兑换。请求里只有角色、低档币种与事务号；
  // 档位顺序、相邻比例与每次给多少全在 config/stone_exchange.json，
  // 客户端带不进任何数值，也不经过拍卖。
  rpc ExchangeStone(ExchangeStoneRequest) returns (ExchangeStoneResponse);

  // P3-2a：任务发放的灵石成交结算。全局服务转过来，角色服在一笔事务里
  // 写双方灵石、买方金币、卖方净额与挂单状态；档位、数量、标价、税率
  // 与税额全从库和配置读。税仍直接销毁，不进任何角色。
  rpc SettleStoneAuction(StoneAuctionSettleRequest) returns (StoneAuctionSettleResponse);

  // P3-3a4：城战结束后的领地写回。战斗服只把服务端确认过的胜方事实值送过来，
  // 城池编号、抽成比例与归属变更都在角色服从配置和库里读；请求里带不进税率、
  // 旧归属，也不带任何奖励 / 金币 / 灵石。同一个事务号只写一次。
  rpc ApplySiegeResult(ApplySiegeResultRequest) returns (ApplySiegeResultResponse);

  // P3-4a2：赛季通行证。免费轨只发称号与外观碎片，付费轨只发当季秘境外观、
  // 洞府摆件与很少几张保护券（就是 enhance.json 的 protect_item_id，和商城同一种）。
  // 奖励内容全在 config/season_pass.json，哪一季由角色服向全局服务确认；
  // 请求里带不进物品编号、数量、季，也带不进任何金币 / 灵石 / 强化石 / 装备。
  rpc DescribeSeasonPass(DescribeSeasonPassRequest) returns (DescribeSeasonPassResponse);
  rpc ClaimSeasonPassReward(ClaimSeasonPassRequest) returns (ClaimSeasonPassResponse);
  // P3-4b：这个账号有几个角色位、已经用掉几个。第二角色栏是账号级状态发货：
  // 名额记在库里的 "角色".character_slot，基础位与上限只在 config/character_slot.json，
  // 装备 / 等级 / 境界仍按角色各存一行，这条口只回名额与人数，不碰任何角色数据。
  rpc DescribeCharacterSlots(DescribeCharacterSlotsRequest) returns (DescribeCharacterSlotsResponse);
  // P3-4b：外观收藏是账号级只读视图——同账号下所有角色持有的外观类物品取并集。
  // 方案写定「外观收藏可以共享」，装备 / 等级 / 境界不共享；这条口不写库、
  // 不改背包归属、不新建解锁流水。
  rpc DescribeWardrobe(DescribeWardrobeRequest) returns (DescribeWardrobeResponse);
  // C1 主线十二场：只读口只回角色库里的剧情进度与下一场编号；十二场内容在
  // config/mainline.json，不进协议、不发给客户端自己算。
  rpc DescribeMainline(DescribeMainlineRequest) returns (DescribeMainlineResponse);
  // C1 交任务：请求只带角色号、场号与（第 10 场才有的）立仙或立魔。事务号由网关生成，
  // 复用 P1-1b5 的 grant_txn；奖励、等级、境界、门槛数值一个都带不进来。
  rpc TurnInMainline(TurnInMainlineRequest) returns (TurnInMainlineResponse);
  // K3：配方目录。只读；材料 / 产出 / 费用 / 成功率 / 耗时 / 解锁等级只从
  // config/recipes.json 读，这里只回事实值，不让客户端自己算。
  rpc DescribeRecipes(DescribeRecipesRequest) returns (DescribeRecipesResponse);
  // K3：开始制作。扣材料与费用、写一件进行中的活；ready_at 由 craft_time_s 算。
  // 请求只带配方编号，数值一个都带不进来。
  rpc StartCraft(StartCraftRequest) returns (StartCraftResponse);
  // K3：收取。只有过了 ready_at 才掷 success_pct；失败也写流水、不返材料。
  rpc FinishCraft(FinishCraftRequest) returns (FinishCraftResponse);
  // K3：当前有没有活、还差几秒。只读。
  rpc DescribeCraft(DescribeCraftRequest) returns (DescribeCraftResponse);
  // Q5/J2：主城修炼 / 境界任务面板。任务、次数、门槛与奖励只在
  // config/city_tasks.json；周期键只由 config/calendar.json 算，客户端算不了。
  rpc DescribeCityTasks(DescribeCityTasksRequest) returns (DescribeCityTasksResponse);
  // Q5/J2：完成一条任务。一笔事务里抢 grant_txn → 发灵石 → 写城池灵石抽成流水
  // → 进度 +1；同一事务号重放回 duplicate，不二次发灵石。请求里带不进数量、
  // 税率、等级与境界：全部由角色服按配置与库里的事实值判。
  rpc CompleteCityTask(CompleteCityTaskRequest) returns (CompleteCityTaskResponse);
  // Q9/H4：逃跑惩罚。战斗服在一场里判出「主动退 / 窗口超时没回来」时写一次事实，
  // 到期时刻由角色服按 penalty_ms 现算（战斗服不传绝对时刻，两台机时钟不一致也不怕）；
  // 同一角色重复写取较晚的那一个，不叠加。请求里带不进剩余时长、也不改任何人的
  // 金币 / 经验 / 疲劳——惩罚只挡下一次进本。
  rpc RecordDeserter(RecordDeserterRequest) returns (RecordDeserterResponse);
  // Q9/H4：这个角色还要等多久才能再进本。只读；没被罚过回 remaining_ms = 0。
  rpc DescribeDeserter(DescribeDeserterRequest) returns (DescribeDeserterResponse);

  // B4：玩法坐骑。方案 9.4 写定普通和高级只差移动速度、商城坐骑只换外观不叠速度。
  // 请求只带背包格号 / 角色号；档位与 speed_bps 只在 config/mount.json，
  // 客户端带不进任何数值，也不进战斗。拒绝码见 MountResponse.reason。
  rpc MountUp(MountUpRequest) returns (MountResponse);
  rpc Dismount(DismountRequest) returns (MountResponse);
  rpc DescribeMount(DescribeMountRequest) returns (DescribeMountResponse);
  // B4：灵兽收集度与生活协助合计。只做收集 / 外观 / 生活协助，不进入伤害公式；
  // 收集口径与外观收藏一致（背包现在持有就算），三档与加成只在 config/spirit_beast.json。
  rpc DescribeSpiritBeast(DescribeSpiritBeastRequest) returns (DescribeSpiritBeastResponse);

  // Q10/I2：背包操作四条。格号从 1 起，上限取 character.json 的 bag_slots。
  // 移动：空格直接挪、两格不同物品交换、同物品在堆叠上限内合并；强化挂在背包行 id 上，
  // 这里只改 slot，所以不丢也不串。合并会删掉来源行，来源行有强化就直接拒绝。
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse);
  // 丢弃：必须带 confirm=true（二次确认），事务号由网关生成，同一号重放回 duplicate，
  // 不二次丢。丢光就删行（强化行跟着 CASCADE 走），没丢光的只减数量。
  rpc DiscardItem(DiscardItemRequest) returns (DiscardItemResponse);
  // 排序：种类 → 品阶 → 物品编号，紧凑到第 1 格。只改 slot，绑定、绑定时刻、
  // 数量、强化等级一个都不动。
  rpc SortInventory(SortInventoryRequest) returns (SortInventoryResponse);
  // 批量使用：一次扣叠里的 N 个。效果入口不在本卡：已接效果入口的物品逐个走原入口，
  // 「同时只生效一个」的那类拒绝连用；还没接效果的（回春丹、凝神丹、符）回 no_effect，
  // 一个都不扣，等 B1 接。
  rpc UseItemBatch(UseItemBatchRequest) returns (UseItemBatchResponse);

  // B11：竞技场一场通关的段位分。战斗服在竞技场模式下打掉 Boss 时逐人报一次，
  // 请求只带角色号、幂等号与模式：加多少分、升到哪一档、发什么外观全部由角色服
  // 按 config/arena_rank.json 现取。季向全局服务确认，客户端带不进分数与档位；
  // 段位不改竞技场模板属性（P2-3a 一字不变）。
  rpc ReportArenaResult(ReportArenaResultRequest) returns (ReportArenaResultResponse);
  // B11：这个角色这一季多少分、当前哪一档、下一档差多少、每档外观领没领。只读。
  rpc DescribeArenaRank(DescribeArenaRankRequest) returns (DescribeArenaRankResponse);
  // B11：领本季某一档的专属外观。门槛只认库里记下的分数；同一季同一档只领一次，
  // 同一事务号重放回 duplicate。物品编号从配置读，客户端带不进来。
  rpc ClaimArenaAppearance(ClaimArenaAppearanceRequest) returns (ClaimArenaAppearanceResponse);
  // B11：本季段位排行。只读、只回前 N 名（N 在 config/arena_rank.json），
  // 名字与职业取角色表事实值，不写库、不缓存、不跨服。
  rpc DescribeArenaLeaderboard(DescribeArenaLeaderboardRequest) returns (DescribeArenaLeaderboardResponse);
}

message SettleExpRequest {
  // 网关转发时填令牌账号，where 里再核一次归属；战斗服服间直连时为空，
  // 只按 character_id 找角色。客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 幂等号：一场通关一个号，同一号只发一次。
  string txn_id = 3;
  // 只记账，不参与数值：dungeon / activity / task / arena ...
  string source = 4;
  // 同一场的进本人数，与战斗服连接、角色服进本用的是同一个数字。
  uint32 party_size = 5;
  // 同一场所有参战角色编号，用于判同宗门加成（P2-1c）。至少两人才有意义；
  // 客户端填不进来，由战斗服服间直连带上、网关透传。
  repeated uint64 member_ids = 6;
  // P3-1a2 补正：这一场所在副本的编号。空串表示不是副本结算（表世界、活动、
  // 竞技场等），按方案 8.1「表世界不结算战斗，不计历练」一笔历练都不给。
  // 副本是不是有资格进，角色服在进本那一步已经判过，这里只按编号查配置。
  string dungeon_id = 7;
  // 这一场击杀的有资格怪物数。历练 = config/dungeons.json 的 drill × 这个数，
  // 由角色服在同一事务里算并写入；战斗服只报击杀数，带不进任何历练数值。
  // 0 表示这一场没有可计历练的击杀（例如没通关）。
  uint32 qualified_kills = 8;
  // N6：战斗服报的掉落事实（物品编号与数量）。角色服逐条对照
  // config/dungeon_drops.json，表外物品整笔拒绝；与经验、历练同一事务号经 grant_txn 入包。
  // 非副本结算（dungeon_id 空）不许带掉落行。
  repeated SettleDropLine drops = 9;
}

// 一场副本结算里的一条掉落事实。
message SettleDropLine {
  string item_id = 1;
  int32 count = 2;
}

message SettleExpResponse {
  // true 表示这个号已经发过，本次一笔没发。
  bool duplicate = 1;
  // 这一笔的基础经验；只有基础经验时 party_bonus 是 0。
  int64 base_exp = 2;
  int64 party_bonus = 3;
  int64 exp_gain = 4;
  int32 level_before = 5;
  int32 level = 6;
  // 当前等级还剩下的经验。
  int64 exp = 7;
  // 方案写定 100，到此后等级不再提高。
  int32 level_cap = 8;
  bool at_cap = 9;
  uint32 party_size = 10;
  string source = 11;
  // P1-5c7：这一笔生效的道具倍率（100 是原倍率）与它额外带来的经验。
  // 都是只读结果，客户端与战斗服都带不进来；判定在角色服用库里的到期时刻做。
  uint32 booster_pct = 12;
  int64 booster_exp = 13;
  // P2-1c：同宗门这一截额外经验。整队同宗门、且至少两人才有；独立字段，
  // 叠在组队加成之外，幅度由 config/exp.json 的 same_sect_bonus_pct 决定。
  // 只作回包事实值，客户端与战斗服都带不进来。
  int64 same_sect_bonus = 14;
  // P3-1a2 补正：与这一笔经验在同一事务里写下的历练值，以及写后的事实值。
  // 0 表示这次没给历练，原因看 drill_reason；重放时两者都是 0 / 当前值。
  int64 drill_gain = 15;
  int64 drill = 16;
  // 没给历练的原因：no_dungeon / unknown_dungeon / no_kills / realm_locked /
  // realm_not_enough / realm_unknown / drill_txn_conflict；空串表示给了。
  string drill_reason = 17;
}

message UseHotSpringRequest {
  string account = 1;
  uint64 character_id = 2;
}

message UseHotSpringResponse {
  // 使用前的当日有效疲劳（跨天归零后按 0 算）。
  int32 fatigue_before = 1;
  // 实际恢复量：不超过配置值，也不超过当日已用疲劳。
  int32 recovered = 2;
  // 使用后的当日已用疲劳，永不为负。
  int32 fatigue = 3;
  int32 fatigue_daily_cap = 4;
  // 配置里的单次恢复量，回给客户端，不让它自己另算一套。
  int32 recovery_limit = 5;
  int32 weekly_share = 6;
}

message EnterDungeonRequest {
  string account = 1;
  uint64 character_id = 2;
  string dungeon_id = 3;
  // 这次一起进本的人数。主线必须是 1。
  uint32 party_size = 4;
}

message EnterDungeonResponse {
  // true 表示允许进本，false 表示被拒（reason 里给原因）。
  bool allowed = 1;
  string reason = 2;
  uint32 max_players = 3;
  // 进本之后这个角色的疲劳与周份额。主线这两种都不动。
  int32 fatigue = 4;
  int32 weekly_share = 5;
  uint64 entry_id = 6;
  // 这一次要扣多少疲劳（深渊 = 单人基础 × 进本人数，主线与巢穴 = 0），被拒时为 0。
  int32 fatigue_cost = 7;
  // 当天的疲劳上限，配置来自 config/dungeons.json。
  int32 fatigue_daily_cap = 8;
  // 这一次扣掉多少周份额（巢穴 = 进本人数，主线与深渊 = 0），被拒时为 0。
  int32 weekly_share_cost = 9;
  // 这一周还剩多少个单人份（方案写定每周 12 个）。
  int32 weekly_share_remaining = 10;
  // 一周的总份额，配置来自 config/dungeons.json。
  int32 weekly_share_cap = 11;
  // 本次应得的单人产出份数：单人通关产出 × 进本人数；主线与深渊为 0。
  // 实物种类与数量属掉落表，在后面的卡发放。
  int32 reward_shares = 12;
  // P2-2a：这个副本至少要几个人才能进。普通本恒为 1，高难本（龙巢）是配置里的
  // min_players。客户端只用来提示，判定在角色服与战斗服，请求里带不进来。
  uint32 min_players = 13;
  // P2-2a：高难本每人每周的进入次数与本周已用次数。次数以角色服里已经写下的
  // 进本记录为准（「角色」.dungeon_entry 按周计数），进本那一刻就算用掉一次，
  // 进程在奖励写入前崩溃也不退回。不是高难的本这三个字段恒为 0。
  int32 hard_entries_used = 14;
  int32 hard_entries_cap = 15;
  int32 hard_entries_remaining = 16;
  // Q9/H4：这个角色还要等多少秒才能再进本（逃跑惩罚）。0 表示没被罚；
  // 大于 0 时 allowed 一定是 false、reason = deserter_penalty，且不扣疲劳 / 次数。
  uint32 deserter_remaining_s = 17;
}

// Q8/H2：战斗服结算前问一次「这一场按哪种分配口径发掉落」。
// 请求只有一个角色号（本场任一成员）；队伍、队长、成员与 loot 规则都由
// 角色服转社交服拿事实值，客户端与战斗服都带不进来。没队伍时回 personal。
message DescribeLootScopeRequest {
  uint64 character_id = 1;
}

message DescribeLootScopeResponse {
  // personal / need_greed。社交服不可达或没有队伍时一律 personal。
  string loot_mode = 1;
  // none / server。need_greed 时恒为 server（掷点只在服务端）。
  string loot_roll = 2;
  int32 roll_min = 3;
  int32 roll_max = 4;
  // 服务端事实成员（不在队伍时只有自己）。战斗服按它与本场实际上报成员取交集。
  repeated uint64 member_ids = 5;
  uint64 leader_character_id = 6;
  bool in_party = 7;
}

// 一条变更：加/减货币，或者往格子里放物品。一个事务里可以混着来。
message GrantEntry {
  oneof body {
    CurrencyDelta currency = 1;
    ItemDelta item = 2;
  }
}

message CurrencyDelta {
  string kind = 1;
  // 可正可负；扣成负数整笔不做。
  int64 delta = 2;
}

message ItemDelta {
  uint32 slot = 1;
  string item_id = 2;
  int32 count = 3;
}

message ApplyGrantRequest {
  string account = 1;
  uint64 character_id = 2;
  // 客户端给的唯一号。同一个号只能发一次奖。
  string txn_id = 3;
  repeated GrantEntry entries = 4;
}

message ApplyGrantResponse {
  // true 表示这个号已经用过了，这一笔没有执行。
  bool duplicate = 1;
  repeated CurrencyBalance balances = 2;
  repeated InventorySlot slots = 3;
}

message AddCurrencyRequest {
  string account = 1;
  uint64 character_id = 2;
  // gold / stone_1..stone_5 / yuanbao / home_coin
  string kind = 3;
  int64 delta = 4;
}

message CurrencyBalance {
  string kind = 1;
  int64 amount = 2;
}

message GetCurrencyRequest {
  string account = 1;
  uint64 character_id = 2;
}

message GetCurrencyResponse {
  repeated CurrencyBalance balances = 1;
}


message SetLevelRequest {
  string account = 1;
  uint64 character_id = 2;
  int32 level = 3;
}

message SetLevelResponse {
  uint64 character_id = 1;
  int32 level = 2;
}

message AddItemRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  string item_id = 4;
  int32 count = 5;
}

message InventorySlot {
  uint32 slot = 1;
  string item_id = 2;
  int32 count = 3;
  bool bound = 4;
  // B9：这一行正穿在哪个部位（weapon / armor / accessory）。空串表示没穿在身上。
  string equipped_slot = 5;
  // B3 / U20：这一行是制作产出的装备时，服务端在出产那一次掷出来的主属性与附加属性
  // （写在那一件上，不是按物品表算的）。不是制作产出就 craft_attr 留 0、craft_extras 为空。
  // 只读：客户端请求体带不进，也没有写入入口（掷点只在 FinishCraft 一处）。
  int32 craft_attr = 6;
  repeated CraftExtra craft_extras = 7;
}

message ListInventoryRequest {
  string account = 1;
  uint64 character_id = 2;
}

message ListInventoryResponse {
  repeated InventorySlot slots = 1;
  uint32 bag_slots = 2;
  // 只读：角色服从角色表读出的名字，供表世界「再远只留名字」的名字牌使用。
  // 网关复核归属时取，客户端不能通过请求体改它。
  string character_name = 3;
  // 只读：角色表当前的境界。世界服判飞行与跨区时来问，只在这一段服与服之间传，
  // 客户端请求体带不进，也没有任何写入接口（突破在后面的卡）。库里的 realm 一律是
  // 顺序表规范名；旧数据里的散仙在这里也归一成金仙。
  string realm = 4;
  // 只读展示名（C2）：第十段按第十场的立仙 / 立魔分路显示——立仙显示金仙、立魔显示散仙；
  // 其余境界与 realm 相同。只给屏用，门槛判定仍读 realm，不用这个字段。
  string realm_display = 5;
  // B4：骑着的玩法坐骑相对 world.json 的 max_move_speed 再加多少万分比；没骑回 0。
  // 世界服判地表位移上限时来问，客户端请求体带不进，也没有写入入口（骑上 / 下在下面两条）。
  int32 mount_speed_bps = 7;
}

// Q10/I2：移动一格。来源格必须非空，目标格可以是空格、同一件物品（合并）
// 或另一件物品（两格交换）。格号上限取 character.json 的 bag_slots。
message MoveItemRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 from_slot = 3;
  uint32 to_slot = 4;
}

message MoveItemResponse {
  bool ok = 1;
  // 拒绝码：character_not_found / same_slot / slot_empty / stack_overflow /
  // row_attached（来源行上有强化或结晶，合并会连附属一起删）/ bag_full。
  // 格号越界、数量为 0 这类参数错走 RPC 的 InvalidArgument，不在这里回。
  string reason = 2;
  // 移完之后两格的现状；空格回格号、空物品编号、count=0、bound=false。
  InventorySlot source = 3;
  InventorySlot target = 4;
  // 同物品合并（true）还是挪走 / 交换（false）。
  bool merged = 5;
  // 两格互换时为 true；挪到空格或合并时为 false。
  bool swapped = 6;
}

message DiscardItemRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  int32 count = 4;
  // 二次确认。false 一律拒绝 not_confirmed，一个字节都不写。
  bool confirm = 5;
  string txn_id = 6;
}

message DiscardItemResponse {
  bool ok = 1;
  // 拒绝码：character_not_found / slot_empty / count_invalid（比这一格还多）/
  // not_confirmed / duplicate。丢光才删行。
  string reason = 2;
  string item_id = 3;
  // 丢掉之后这一格还剩几个；丢光或被拒都是 0。
  int32 count_left = 4;
  bool duplicate = 5;
}

message SortInventoryRequest {
  string account = 1;
  uint64 character_id = 2;
}

message SortInventoryResponse {
  bool ok = 1;
  // 拒绝码：character_not_found / bag_full（满格时没有临时格可周转）。
  string reason = 2;
  // 实际换了格的行数；已经是排好的顺序时为 0。
  uint32 moved = 3;
  // 排完之后的整份背包，按格号升序。
  repeated InventorySlot slots = 4;
}

message UseItemBatchRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  int32 count = 4;
  string txn_id = 5;
}

message UseItemBatchResponse {
  bool ok = 1;
  // 拒绝码：character_not_found / slot_empty / count_invalid / not_usable /
  // no_effect / effect_single_instance / duplicate。被拒时 used 一定是 0。
  string reason = 2;
  string item_id = 3;
  // 这一笔真扣掉几个；被拒时是 0。
  int32 used = 4;
  int32 count_left = 5;
  bool duplicate = 6;
}

message CanTradeRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
}

message CanTradeResponse {
  bool tradable = 1;
  // tradable=false 时给原因：bound_item / slot_empty
  string reason = 2;
}

// 强化一次装备。只带要强化的格子和用哪种石头；目标等级由角色服从库里读出的
// 当前等级 +1 算，档位、材料、消耗与成功率都由角色服按配置决定。
// txn_id 由网关生成（客户端填不进来），同一笔不会扣两次材料。
message EnhanceRequest {
  // 网关转发时填令牌账号，角色服再核一次归属。
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  string stone_id = 4;
  string txn_id = 5;
  // 这一手用不用保护券。只带这个开关：券编号、数量、来源、成功率、等级、
  // 结果与余额都带不进来，也不存在「必成券」这种东西。
  bool use_coupon = 6;
}

message EnhanceResponse {
  // 业务前提不满足（wrong_stone / at_cap / insufficient ...）是正常回包里的
  // ok=false + reason，不是 gRPC 错误码；身份与参数错才走错误码。
  bool ok = 1;
  string reason = 2;
  int32 level_before = 3;
  int32 level = 4;
  // 配置里的上限，回给客户端，不让它自己另算一套。
  int32 max_level = 5;
  bool success = 6;
  // 只作展示：low / mid / high，客户端不拿它算数值。
  string tier = 7;
  string required_stone = 8;
  int32 stone_cost = 9;
  int64 gold_cost = 10;
  int64 gold = 11;
  int32 stone_left = 12;
  // 同一个事务号再提交：一笔没做。
  bool duplicate = 13;
  // 只作展示：这一档从 config/enhance.json 读出的成功率。带券与不带券是同一个数，
  // 券不提高成功率；客户端不拿它算数值，也不参与请求。
  double success_rate = 14;
  // 这一手失败，但掉级被保护券挡住了（等级 = level_before）。
  bool protected_level = 15;
  // 这一手实际用掉几张券：只在「真的挡下一次掉级」时是 1，成功或没用券都是 0。
  int32 coupon_used = 16;
  // 只作展示：背包里还剩几张这种券。
  int32 coupon_left = 17;
}

// 把强化等级从来源格转到目标格。只带两个格子：
// 两格等级、绑定、转移石编号 / 张数、金币费用、结果与事务号都带不进来。
message TransferEnhanceRequest {
  // 网关转发时填令牌账号，角色服再核一次归属。
  string account = 1;
  uint64 character_id = 2;
  uint32 from_slot = 3;
  uint32 to_slot = 4;
  string txn_id = 5;
}

message TransferEnhanceResponse {
  // 业务前提不满足（source_not_higher / slot_empty / not_equipment /
  // stone_insufficient / gold_insufficient ...）是正常回包里的 ok=false + reason，
  // 不是 gRPC 错误码；身份与参数错才走错误码。未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  int32 from_level_before = 3;
  int32 to_level_before = 4;
  int32 from_level = 5;
  int32 to_level = 6;
  // 配置里的强化上限，回给客户端，不让它自己另算一套。
  int32 max_level = 7;
  // 只作展示：这一手实际扣的金币与转移石。客户端不拿它们算结果。
  int64 gold_cost = 8;
  int64 gold = 9;
  string stone_item = 10;
  int32 stone_cost = 11;
  int32 stone_left = 12;
  // 只作展示：目标格转移前后的绑定状态。来源绑定时目标会变成绑定。
  bool target_bound_before = 13;
  bool target_bound = 14;
  // 同一个事务号再提交：一笔没做。
  bool duplicate = 15;
}

// 能量结晶装上（方案第 9 章第 3 层）。只带三个格位编号：
// 结晶类别、装备部位、固定值、能不能装、结果和事务号都带不进来。
message InstallCrystalRequest {
  // 网关转发时填令牌账号，角色服再核一次归属。
  string account = 1;
  uint64 character_id = 2;
  // 要装结晶的装备格。
  uint32 slot = 3;
  // 结晶现在放在背包的哪一格。服务端自己读这一格的物品编号。
  uint32 crystal_slot = 4;
  // 装到第几个镶嵌位。位数与合法范围由配置决定。
  uint32 socket = 5;
  string txn_id = 6;
}

// 拆下：只带装备格与镶嵌位，拆下来的结晶由角色服放回背包。
message RemoveCrystalRequest {
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
  uint32 socket = 4;
  string txn_id = 5;
}

message CrystalResponse {
  // 业务前提不满足（wrong_part / not_crystal / socket_occupied / socket_empty ...）
  // 是正常回包里的 ok=false + reason，不是 gRPC 错误码；身份与参数错才走错误码。
  // 未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  // 结果态：true 装上了、false 拆下了。客户端不拿它算数值。
  bool installed = 3;
  uint32 slot = 4;
  uint32 socket = 5;
  string crystal_item = 6;
  // 只作展示：类别与部位只在服务端从配置读，客户端不另算一套。
  string category = 7;
  string part = 8;
  // 配置里的镶嵌位数量，回给客户端，不让它自己另算。
  int32 socket_count = 9;
  int32 filled_before = 10;
  int32 filled = 11;
  int32 crystal_left = 12;
  // 只作展示：装上 / 拆下都不改金币、强化等级和绑定，回出来给核对看。
  int64 gold = 13;
  int32 enhance_level = 14;
  bool bound = 15;
  // 同一个事务号再提交：一笔没做。
  bool duplicate = 16;
}

// 拍卖成交结算。全局服务转发时只带买方角色、挂单号与事务号：
// 标价、卖方、物品编号、绑定、税率、税额、到账与结果都由角色服从库和
// config/auction.json 读，多传这些字段也不会被反序列化进请求。
message AuctionSettleRequest {
  string account = 1;
  uint64 character_id = 2;
  uint64 listing_id = 3;
  string txn_id = 4;
}

message AuctionSettleResponse {
  // listing_not_found / listing_sold / same_character / bound_item /
  // item_missing / bag_full / gold_insufficient 等业务前提是 ok=false + reason，
  // 不是 gRPC 错误码；未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  uint64 listing_id = 3;
  int64 price_gold = 4;
  // 从买方标价里销毁的那一部分，不写进任何角色或系统账户。
  int64 tax_gold = 5;
  int64 net_gold = 6;
  int64 buyer_gold = 7;
  int64 seller_gold = 8;
  int32 tax_rate_pct = 9;
  string item_id = 10;
  uint32 count = 11;
  string state = 12;
  bool duplicate = 13;
  // B5：摆摊成交时带上摊位号与还剩几件，网关据此刷新世界服的显示；
  // 拍卖成交这两个字段留空 / 0。它们只用于显示，不参与任何判定。
  string stall_id = 14;
  int32 live_listings = 15;
}

// 元宝寄售成交结算。全局服务转发时只带买方角色、挂单号与事务号：
// 标价、卖方、元宝币种、税率、税额、到账与结果都由角色服从库和
// config/auction.json 读，多传这些字段也不会被反序列化进请求。
message AuctionIngotSettleRequest {
  string account = 1;
  uint64 character_id = 2;
  uint64 listing_id = 3;
  string txn_id = 4;
}

message AuctionIngotSettleResponse {
  // listing_not_found / listing_sold / same_character / gold_insufficient /
  // ingot_insufficient 等业务前提是 ok=false + reason，不是 gRPC 错误码；
  // 未生效的数值字段一律留 0。
  bool ok = 1;
  string reason = 2;
  uint64 listing_id = 3;
  int64 ingot_amount = 4;
  int64 price_gold = 5;
  // 从买方标价里销毁的那一部分，不写进任何角色或系统账户。
  int64 tax_gold = 6;
  int64 net_gold = 7;
  int64 buyer_gold = 8;
  int64 seller_gold = 9;
  // 元宝等量转移：卖方 -ingot_amount、买方 +ingot_amount，全库总量不变。
  int64 buyer_ingot = 10;
  int64 seller_ingot = 11;
  int32 tax_rate_pct = 12;
  string state = 13;
  bool duplicate = 14;
}

message BuyShopItemRequest {
  // 网关转发时填令牌账号；客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 只带商品编号。标价、数量、发货种类、绑定态都由服务端按清单与配置来，
  // 客户端一个都带不进来。
  string item_id = 3;
  // 网关生成的幂等号。这张卡不写库，编号只进日志与回包，便于核对同一笔请求。
  string txn_id = 4;
}

message BuyShopItemResponse {
  bool ok = 1;
  // not_in_list（清单外）/ delivery_pending（清单内但还没接发货）/
  // not_enough_yuanbao（元宝不够）/ bag_full（背包满）/ 空串表示真的发出去了。
  string reason = 2;
  string item_id = 3;
  string kind = 4;
  string name = 5;
  // 清单里的标价。清单外时为 0：未生效的数值一律给 0，不拿别的数顶。
  int64 price_yuanbao = 6;
  string currency = 7;
  // 元宝余额，从角色服读出来的事实值，不是算出来的。成交时是这一笔之后的余额。
  int64 balance = 8;
  // 够不够买。清单外为 false。
  bool enough = 9;
  // 这一笔真扣掉的元宝。没成交恒为 0——未生效的数值一律给 0。
  int64 charged_yuanbao = 10;
  // 东西有没有真进背包。没成交恒为 false。
  bool delivered = 11;
  string state = 12;
  // 发到包里的物品编号。没接发货、没成交时为空串。
  string delivery_item_id = 13;
  // 落在背包第几格。没落包时为 0。
  uint32 bag_slot = 14;
  // 到账即绑：商城卖的券与符都是绑定物，这张卡发的保护券恒为 true。
  bool bound = 15;
  // 同一个事务号重复提交时为 true：整笔不做，余额与背包都不动。
  bool duplicate = 16;
  // P3-4a2：通行证是商城里的「状态发货」，买下即开本季付费轨，不往背包放东西。
  // 这一笔对应的季（角色服向全局服务确认的事实值）与付费轨是否已开，只在这条
  // 商品上是有效值：别的商品恒空串 / false，不拿它们顶任何数。
  string season_id = 17;
  bool pass_owned = 18;
  // P3-4b：第二角色栏买完之后这个账号一共几个角色位（账号级事实值，从库里读回）。
  // 只在 kind=second_slot 这条商品上是有效值：别的商品恒 0，不拿它顶任何数。
  int32 character_slots = 19;
  // B7+B8：背包扩容买完之后这个角色一共几格（按角色的仓位事实值，从库里读回）。
  // 只在 bag_expand 这条发货方式上是有效值：别的商品恒 0，不拿它顶任何数。
  uint32 bag_slots = 20;
}

message BuyHomeCoinShopRequest {
  string account = 1;
  uint64 character_id = 2;
  string item_id = 3;
  string txn_id = 4;
}

message BuyHomeCoinShopResponse {
  bool ok = 1;
  string reason = 2;
  string item_id = 3;
  string kind = 4;
  string name = 5;
  int64 price_home_coin = 6;
  string currency = 7;
  int64 balance = 8;
  bool enough = 9;
  int64 charged_home_coin = 10;
  bool delivered = 11;
  string state = 12;
  string delivery_item_id = 13;
  uint32 bag_slot = 14;
  bool bound = 15;
  bool duplicate = 16;
}

// 回复落在哪个池。方案 12.1：红符只回生命、蓝符只回蓝量，两者互不越界。
// 这是协议层的枚举，不是配置数值；具体回多少由 config/talisman.json 给。
enum TalismanPool {
  TALISMAN_POOL_UNSPECIFIED = 0;
  TALISMAN_POOL_HP = 1;
  TALISMAN_POOL_MANA = 2;
}

message ConsumeTalismanRequest {
  // 战斗服服间直连时为空，只按 character_id 找角色；客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 只带物品编号。数量恒为 1，回复值与冷却都不在请求里——客户端一个都带不进来，
  // 也就能改不了「这一张回多少血」。
  string item_id = 3;
  // 战斗服生成的幂等号：同一个号只扣一张，重放整笔不做。
  string txn_id = 4;
}

message ConsumeTalismanResponse {
  bool ok = 1;
  // not_talisman（不是符）/ no_talisman（背包里没有这张）/ 空串表示真扣掉了。
  string reason = 2;
  string item_id = 3;
  // 扣掉之后背包里还剩几张。没扣时给的是当前张数（事实值，不是算出来的）。
  int64 count_left = 4;
  // 扣的是哪一格。没扣时为 0。
  uint32 slot = 5;
  // 同一个号重放：这一笔没执行，张数不动。
  bool duplicate = 6;
  // 配置里的回复值。战斗服照着这个加，不自己写第二套数。
  // 红符只有 hp_restore，蓝符只有 mana_restore，另一个恒 0——不回血就是在这里落死的。
  int64 hp_restore = 7;
  // 配置里的冷却与冷却组。红符是 heal 组（和红药、牧师治疗共用），
  // 蓝符是 mana 组（和蓝药共用），两组互不占用。
  uint32 cooldown_ms = 8;
  string cooldown_group = 9;
  // 这一张回复落在哪个池。战斗服据此决定加到血还是蓝，不按物品编号自己猜。
  TalismanPool pool = 10;
  // 蓝符的回复值；红符恒 0。
  int64 mana_restore = 11;
}

// 用符之前的只读查询。请求里只有编号，没有数量、回复值或冷却——
// 客户端/战斗服都带不进来服务端的数。
message DescribeTalismanRequest {
  uint64 character_id = 1;
  string item_id = 2;
}

message DescribeTalismanResponse {
  bool ok = 1;
  // not_talisman（不是符）/ upstream_off（角色服没连上）/ 空串表示查到了。
  string reason = 2;
  string item_id = 3;
  // 查到了才有意义：这一张回复落在哪个池。
  TalismanPool pool = 4;
  // 只读的背包张数，事实值；真正扣不扣由 ConsumeTalisman 那笔事务再判一次。
  int64 count_left = 5;
}

// B1：丹药的回复池。和符一样只有两池——方案 12.1 写定回春丹 / 气血丹回复生命，
// 凝神丹 / 回灵丹是蓝药、只回复蓝量。突破丹（筑基丹 / 破镜丹）不进战斗，
// 没有池：它们在境界突破事务里扣，见 AdvanceRealmResponse 的 pill_* 三列。
enum PillPool {
  PILL_POOL_UNSPECIFIED = 0;
  PILL_POOL_HP = 1;
  PILL_POOL_MANA = 2;
}

message DescribePillRequest {
  uint64 character_id = 1;
  string item_id = 2;
}

message DescribePillResponse {
  bool ok = 1;
  // not_pill（不是丹）/ upstream_off（角色服没连上）/ 空串表示查到了。
  string reason = 2;
  string item_id = 3;
  PillPool pool = 4;
  // 只读的背包颗数，事实值；扣不扣由 ConsumePill 那笔事务再判一次。
  int64 count_left = 5;
}

message ConsumePillRequest {
  // 战斗服服间直连时为空，只按 character_id 找角色；客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  // 只带编号：数量恒为 1，回复值与冷却都不在请求里，客户端改不了「这一颗回多少」。
  string item_id = 3;
  // 战斗服生成的幂等号：同一个号只扣一颗，重放整笔不做。
  string txn_id = 4;
}

message ConsumePillResponse {
  bool ok = 1;
  // not_pill（不是丹）/ no_pill（背包里没有）/ 空串表示真扣掉了。
  string reason = 2;
  string item_id = 3;
  int64 count_left = 4;
  // 扣的是哪一格。没扣时为 0。
  uint32 slot = 5;
  bool duplicate = 6;
  // 配置里的回复值：回血丹只有 hp_restore，蓝药只有 mana_restore，另一个恒 0。
  int64 hp_restore = 7;
  uint32 cooldown_ms = 8;
  // 和符同一组冷却：红药是 heal（和红符、牧师治疗共用），蓝药是 mana（和蓝符共用）。
  string cooldown_group = 9;
  PillPool pool = 10;
  int64 mana_restore = 11;
}

// P1-5c6：用卷轴之前的只读查询。请求里只有角色号与物品编号，没有目标、
// 数量、回复值或冷却——「只拉起自己」在协议结构上就落死了。
message DescribeReviveScrollRequest {
  uint64 character_id = 1;
  string item_id = 2;
}

message DescribeReviveScrollResponse {
  bool ok = 1;
  // not_scroll（编号不对）/ character_not_found / 空串表示查到了。
  string reason = 2;
  string item_id = 3;
  // 背包里还有几张（只读事实值）；真正扣不扣由 ConsumeReviveScroll 的事务再判。
  int64 count_left = 4;
  // 配置里的冷却时长与拉起血量比例、一转基础经验比例。战斗服不写第二套数。
  uint32 cooldown_ms = 5;
  uint32 hp_restore_pct = 6;
  uint32 exp_cost_pct = 7;
  // 角色库里那个人的冷却到期时刻（Unix 毫秒），没用过给 0。跨场保留靠这一列。
  int64 ready_at_ms = 8;
  // 角色服当前时刻（Unix 毫秒）：战斗服拿它和 ready_at_ms 比，不用两边对表。
  int64 now_ms = 9;
  int64 level = 10;
  int64 exp = 11;
}

// P1-5c6：真扣一张卷轴。请求里只有标识，没有任何服务端数值：
// 比例、冷却、扣多少经验全由角色服按 config 与库里的当前级经验算。
message ConsumeReviveScrollRequest {
  // 网关转发时填令牌账号；战斗服服间直连时为空，只按角色号找角色。
  string account = 1;
  uint64 character_id = 2;
  string item_id = 3;
  // 战斗服生成的幂等号：同一个号只扣一张，重放整笔不做。
  string txn_id = 4;
}

message ConsumeReviveScrollResponse {
  bool ok = 1;
  // cooldown / no_scroll / not_scroll / duplicate / character_not_found /
  // server_error / 空串表示真扣掉了。
  string reason = 2;
  string item_id = 3;
  // 扣掉之后背包里还剩几张。没扣时给的是当前张数（事实值）。
  int64 count_left = 4;
  // 拉起按这个比例回到一小段生命（< 100，不满血）；战斗服照着算，不自己写数。
  uint32 hp_restore_pct = 5;
  // 实际扣掉的当前级经验。当前级经验是零时这里是 0，等级不变、不掉级。
  int64 exp_cost = 6;
  int64 level = 7;
  int64 exp_after = 8;
  // 这一张写进角色库的冷却到期时刻（Unix 毫秒），换一场仍读得到。
  int64 ready_at_ms = 9;
  uint32 cooldown_ms = 10;
  // 同一个事务号重放：整笔没执行，卷轴、经验、冷却都不动。
  bool duplicate = 11;
}

// P1-5c7：用掉一张限时经验道具。请求里只有标识与物品编号，
// 时长、倍率、到期时刻、张数一个都带不进来，全由角色服从配置与角色库读。
message UseExpBoosterRequest {
  // 网关转发时填令牌账号；服间可信调用为空，只按角色编号找角色。
  string account = 1;
  uint64 character_id = 2;
  string item_id = 3;
  // 网关生成的幂等号：同一个号只扣一张，重放整笔不做。
  string txn_id = 4;
}

message UseExpBoosterResponse {
  bool ok = 1;
  // not_booster / no_booster / character_not_found / duplicate / 空串表示真用掉了。
  string reason = 2;
  string item_id = 3;
  // 扣掉之后背包里还剩几张；没扣时给的是当前张数（事实值）。
  int64 count_left = 4;
  // 配置里的一段时长与结算倍率，只作回包事实值，生效判定不在这里。
  uint32 duration_ms = 5;
  uint32 gain_pct = 6;
  // 写进角色库的到期时刻与库当前时刻（Unix 毫秒）；剩余时间就是两者之差。
  // 再用一张只刷新同一行的 expires_at，不累加、也不新增第二行。
  int64 expires_at_ms = 7;
  int64 now_ms = 8;
  bool duplicate = 9;
}

// P1-5c8：用掉解绑道具。请求里只有标识与格子；张数、档位、绑定年龄全由角色服
// 从配置与角色库读，客户端一个都带不进来。
message UseUnbindItemRequest {
  // 网关转发时填令牌账号；服间可信调用为空，只按角色编号找角色。
  string account = 1;
  uint64 character_id = 2;
  // 要解绑的那一格，不是解绑道具自己那一格。
  int32 slot = 3;
  string item_id = 4;
  // 网关生成的幂等号：同一个号只扣一次，重放整笔不做。
  string txn_id = 5;
}

message UseUnbindItemResponse {
  bool ok = 1;
  // 空串表示真解开了；not_equipment / not_bound / slot_empty / no_unbind_item /
  // not_enough_unbind / character_not_found / duplicate 表示整笔没做。
  string reason = 2;
  string item_id = 3;
  int32 slot = 4;
  // 被解绑的装备编号（事实值）；拒绝时也给，便于核对。
  string target_item_id = 5;
  // 这一次实际用掉几张（成功时等于配置算出来的数）；拒绝时为 0。
  uint32 cost = 6;
  // 扣掉之后解绑道具还剩几张；拒绝时给当前张数（事实值）。
  int64 count_left = 7;
  // 这一格绑了多久（小时，数据库时钟算），只作事实值，判定在角色服那一笔事务里。
  int64 age_hours = 8;
  // 是否已经到配置下限（绑得最久那一档）。
  bool floor_hit = 9;
}

// P1-5d：建一张内部充值订单。客户端只带商品编号，元宝数由服务端按配置决定；
// 订单号由服务端生成。
message CreateRechargeOrderRequest {
  string account = 1;
  uint64 character_id = 2;
  string product_id = 3;
}

message CreateRechargeOrderResponse {
  bool ok = 1;
  // product_not_found / character_not_found / request_missing；空串表示建好了。
  string reason = 2;
  string order_id = 3;
  string product_id = 4;
  int64 yuanbao = 5;
  // 建单后恒为 pending。
  string status = 6;
}

// P1-5d：结算一笔内部订单（P0 用它模拟支付渠道回调）。同一笔重复调用只发一次。
message SettleRechargeOrderRequest {
  // 网关转发时填令牌账号；结算会核这张订单是不是这个账号的。
  string account = 1;
  string order_id = 2;
}

message SettleRechargeOrderResponse {
  bool ok = 1;
  // order_not_found / duplicate；空串表示这一笔真发了元宝。
  string reason = 2;
  string order_id = 3;
  string status = 4;
  // 这一笔发了多少元宝（duplicate 时也给订单上的数，便于核对）。
  int64 yuanbao = 5;
  // 结算后的元宝余额（事实值）。
  int64 balance = 6;
  int64 paid_at_ms = 7;
  bool duplicate = 8;
}

// P2-3b：战场要按「装备生效」算属性。装备在当前数据模型里只有强化这一条
// 数值成长线，所以这张快照给的是「各槽强化等级之和」，由战斗服乘配置里的
// 每级折算。角色服不做战力、不做平衡，只把库里的值原样给出去。
message DescribeBattleProfileRequest {
  uint64 character_id = 1;
}

message DescribeBattleProfileResponse {
  // 角色不存在时 false，其余字段全是 0，战斗服据此拒绝进场。
  bool found = 1;
  string class_id = 2;
  string branch = 3;
  int32 level = 4;
  int32 enhance_total = 5;
  // 有强化记录的槽位数；只给核对与日志用，不参与战力。
  int32 enhance_slots = 6;
  // 二转步数：0 未转、1 一转、2 二转。生息二转的复活减免按它算。
  int32 branch_step = 7;
  // Q2：段内阶的被动万分比（N10 的 passive_pct_bps）。战斗服的伤害第一段读它，
  // 不另读一份境界配置；低境界是 0，默认值下与旧伤害逐字等价。
  int32 passive_pct_bps = 8;
  // B9：全身已穿装备的固定攻击之和（方案 7.2 第一段的「装备固定攻击」）。
  // 副本按它算攻击；竞技场模板、战场 1.3 压缩、城战全额三条不吃这个字段。
  int32 equip_attack = 9;
  // B10：全身已穿装备的强化等级之和，按 config/enhance.json 的 coef_bps_per_level
  // 折算好的强化系数（万分点）。方案 7.2 第二段读它：基础 × (1 + 系数 + 结晶固定值/基础)。
  // 同样只对副本生效；竞技场模板、战场压缩、城战全额三条不读。
  int32 enhance_coef_bps = 10;
  // B10：已穿装备上攻击类结晶的固定值之和（config/crystal.json 的 fixed_value）。
  // 方案 7.2 第二段把它除以基础攻击当作一项固定值；防御 / 功能两类不进伤害公式。
  int32 crystal_flat_attack = 11;
  int32 awaken_skill_id = 12;
  // A9：这个角色手动加到四属性上的点数（0 = 没加点）。基础值仍在 config/classes.json
  // 的职业表里，战斗服把两截相加之后才算生命 / 蓝量 / 攻击 / 治疗 / 仇恨；
  // 角色服只回加点事实值，不在快照里合成第二份属性数值。
  // 竞技场模板属性不吃这四格（P2-3a：换装与加点都不改模板）；战场 / 城战 / 副本 / 世界 Boss 吃。
  int32 attr_strength = 13;
  int32 attr_agility = 14;
  int32 attr_spirit = 15;
  int32 attr_vitality = 16;
}

// P2-4a：二转。只推进一步已经选定的分支，不另开分支、不改兵器。
message AdvanceBranchRequest {
  // 网关转发时填令牌账号；服间直连为空时只按角色编号找。
  string account = 1;
  uint64 character_id = 2;
  string branch_id = 3;
}

message AdvanceBranchResponse {
  bool ok = 1;
  // not_enough_level / branch_missing / branch_locked / branch_not_found；
  // 空串表示这一笔做成了（或者 duplicate）。
  string reason = 2;
  string branch = 3;
  int32 branch_step = 4;
  int32 level = 5;
  bool duplicate = 6;
}

// B6：觉醒。请求里的分支必须就是 15 级定下的那条；觉醒技编号不在请求里。
message AwakenRequest {
  // 网关转发时填令牌账号；服间直连为空时只按角色编号找。
  string account = 1;
  uint64 character_id = 2;
  string branch_id = 3;
}

message AwakenResponse {
  bool ok = 1;
  // character_not_found / not_enough_level / branch_missing / branch_locked /
  // skill_not_found / already_awakened；空串表示这一笔做成了（或者 duplicate）。
  string reason = 2;
  string branch = 3;
  uint32 skill_id = 4;
  int32 level = 5;
  bool duplicate = 6;
}

message DescribeAwakenRequest {
  uint64 character_id = 1;
}

message DescribeAwakenResponse {
  // 角色不存在时 false，其余字段全是 0，网关据此回 404。
  bool found = 1;
  string branch = 2;
  // 0 表示还没觉醒。
  uint32 skill_id = 3;
  int32 level = 4;
  // 觉醒时刻（服务端时钟，毫秒）；没觉醒就是 0。
  int64 awaken_at_ms = 5;
}

// P2-4a：武器锁。请求只带角色与物品，等级与职业都从库里读。
message CanEquipRequest {
  uint64 character_id = 1;
  string item_id = 2;
}

message CanEquipResponse {
  bool ok = 1;
  // not_equipment / weapon_unknown / level_not_enough / class_mismatch / character_missing
  string reason = 2;
  string weapon_kind = 3;
  int32 require_level = 4;
  int32 level = 5;
  string class_id = 6;
  // B9：这件装备穿在哪个部位（weapon / armor / accessory）。不是装备时为空。
  string equip_slot = 7;
}

// B9：穿上一件。slot 是背包格号，不是部位；部位从这一格的物品定义读。
message EquipItemRequest {
  // 网关转发时填令牌账号；服间可信调用为空，只按角色编号找。
  string account = 1;
  uint64 character_id = 2;
  uint32 slot = 3;
}

message EquipItemResponse {
  bool ok = 1;
  // slot_empty / not_equipment / level_not_enough / class_mismatch / slot_occupied /
  // item_not_found / character_not_found；空串表示穿上了。
  string reason = 2;
  string item_id = 3;
  // 穿上之后这个部位占着的装备（ok 时就是刚穿上的那件）。
  string equip_slot = 4;
  // 全身已穿装备的固定攻击之和（方案 7.2 的「装备固定攻击」），战斗服与屏都读它。
  int32 equip_attack = 5;
  int32 level = 6;
  string class_id = 7;
  uint32 bag_slot = 8;
}

// B9：脱下一件。按部位脱，不按背包格号——同一个部位只有一件。
message UnequipItemRequest {
  string account = 1;
  uint64 character_id = 2;
  string equip_slot = 3;
}

message UnequipItemResponse {
  bool ok = 1;
  // slot_empty / character_not_found；空串表示脱下来了。
  string reason = 2;
  string item_id = 3;
  string equip_slot = 4;
  // 那一格现在的格号：脱下来不换格，就是它原来待着的那一格。
  uint32 bag_slot = 5;
  int32 equip_attack = 6;
}

// P3-1a2：突破。请求只有标识：修为、历练、炼心、灵石与成功率都带不进来。
message AdvanceRealmRequest {
  // 网关转发时填令牌账号；服间可信调用为空，只按角色编号找角色。
  string account = 1;
  uint64 character_id = 2;
  // 幂等号：同一次突破一个号，同一个号再提交不掷第二次。
  string txn_id = 3;
}

message AdvanceRealmResponse {
  // true 表示条件满足、这一笔真的掷过了（成功或失败都算执行）。
  // 条件不满足时 false，reason 给原因，历练与灵石都不动。
  bool ok = 1;
  // 这一笔突破成功：修为进入下一段。失败时 false，修为停在原境界。
  bool success = 2;
  // realm_locked / realm_max / realm_unknown / heart_not_done /
  // drill_not_enough / stone_not_enough / character_not_found；空串表示掷过了。
  string reason = 3;
  string from_realm = 4;
  string next_realm = 5;
  // 这一笔之后的当前境界：成功是下一段，失败仍是 from_realm。
  string realm = 6;
  int64 drill_before = 7;
  int64 drill_required = 8;
  // 这一次要求扣掉的历练与灵石（配置值）；条件不满足时为 0。
  int64 drill_cost = 9;
  string stone_kind = 10;
  int64 stone_cost = 11;
  // 这一笔之后的历练与灵石余额；条件不满足时是当前值（事实值）。
  int64 drill = 12;
  int64 stone_left = 13;
  // 炼心：这一步之前已经走到的主线场次、这一段要求到哪里、还缺哪些必要支线。
  int32 main_stage = 14;
  int32 main_stage_required = 15;
  repeated string side_quests_missing = 16;
  // 配置里的成功率，只作展示；判定在角色服，客户端带不进来。
  int32 success_pct = 17;
  // 同一个事务号再提交：这一笔没掷，历练与灵石都没动。
  bool duplicate = 18;
  // B1：这一笔要求的境界丹（配置值）与扣完的余额。条件不满足时 pill_count 为 0、
  // pill_left 是当前颗数（事实值）。没配丹的段（老配置）两个都是空 / 0。
  string pill_kind = 19;
  int64 pill_count = 20;
  int64 pill_left = 21;
}

// P3-1a2：历练结算。请求只有角色、副本与事务号；给多少历练由配置决定。
message SettleDrillRequest {
  // 战斗服服间直连时为空，只按角色编号找角色；客户端填不了这个字段。
  string account = 1;
  uint64 character_id = 2;
  string dungeon_id = 3;
  string txn_id = 4;
}

message SettleDrillResponse {
  bool ok = 1;
  // unknown_dungeon / realm_locked / realm_not_enough / realm_unknown /
  // character_not_found；空串表示加上了（或者 duplicate）。
  string reason = 2;
  string dungeon_id = 3;
  // 这一笔加上的历练；重复提交时为 0。
  int64 drill_gain = 4;
  // 这一笔之后的历练值（事实值）。
  int64 drill = 5;
  bool duplicate = 6;
}

// N10：段内升阶。一个事务号只升一阶。
message PromoteRealmPhaseRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
}

message PromoteRealmPhaseResponse {
  bool ok = 1;
  // level_not_enough / realm_phase_max / character_not_found
  string reason = 2;
  int32 from_phase = 3;
  int32 to_phase = 4;
  string phase_name = 5;
  int32 passive_pct_bps = 6;
  int32 level = 7;
  int32 level_required = 8;
  bool duplicate = 9;
  // A8：这一次走到大圆满发出去多少可分配点、发完手上还有多少点。
  // 没到大圆满、或者这一段早就发过时为 0，attr_points 仍是事实值。
  int32 points_awarded = 10;
  int32 attr_points = 11;
}

message DescribeRealmPassiveRequest {
  uint64 character_id = 1;
}

message DescribeRealmPassiveResponse {
  bool ok = 1;
  string realm = 2;
  int32 realm_phase = 3;
  string phase_name = 4;
  int32 passive_pct_bps = 5;
  // A8：手上还有多少可分配属性点（A9 的加点从这里减）。只读，网关不本地算。
  int32 attr_points = 6;
}

// A9：属性加点的两条消息。四属性键只认 strength / agility / spirit / vitality，
// 别的键一律 bad_attribute；本版没有洗点 rpc（不做免费洗点），要开就单独派卡。
message DescribeAttributePointsRequest {
  uint64 character_id = 1;
}

message DescribeAttributePointsResponse {
  bool ok = 1;
  string class_id = 2;
  int32 level = 3;
  // 手上还剩多少可分配点（character.attr_points 的事实值，A8 发的）。
  int32 attr_points = 4;
  int32 strength = 5;
  int32 agility = 6;
  int32 spirit = 7;
  int32 vitality = 8;
}

message AllocateAttributePointsRequest {
  // 网关转发时填令牌账号；服间直连为空时只按角色编号找。
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  // strength / agility / spirit / vitality 之一。
  string attribute = 4;
  // 这一次加多少点，至少 1；不够扣就整笔拒绝，不扣半笔。
  int32 points = 5;
}

message AllocateAttributePointsResponse {
  bool ok = 1;
  // bad_txn / bad_attribute / bad_points / not_enough_points / attr_cap_reached /
  // character_not_found；空串表示这一笔做成了（或者 duplicate）。
  string reason = 2;
  // 同一个事务号重放时为 true：不再扣点、不再加属性。
  bool duplicate = 3;
  string class_id = 4;
  int32 level = 5;
  int32 attr_points = 6;
  int32 strength = 7;
  int32 agility = 8;
  int32 spirit = 9;
  int32 vitality = 10;
}

// N12：九位开口的人的收集度；解锁场次与被动万分比只在 config/hero_codex.json。
message DescribeHeroCodexRequest {
  string account = 1;
  uint64 character_id = 2;
}

message HeroCodexEntryFact {
  string id = 1;
  string name = 2;
  int32 unlock_main_stage = 3;
  bool collected = 4;
  int32 passive_pct_bps = 5;
}

message DescribeHeroCodexResponse {
  bool ok = 1;
  int32 main_stage = 2;
  int32 collected_count = 3;
  int32 entry_count = 4;
  // 收集度万分比：collected_count / entry_count * 10000。
  int32 collection_pct_bps = 5;
  int32 total_passive_pct_bps = 6;
  string passive_kind = 7;
  repeated HeroCodexEntryFact entries = 8;
}

// P3-2a：兑换只带低档币种，比例与产出都在角色服从配置读。
message ExchangeStoneRequest {
  string account = 1;
  uint64 character_id = 2;
  string from_kind = 3;
  string txn_id = 4;
}

message ExchangeStoneResponse {
  bool ok = 1;
  // unknown_tier / top_tier / unknown_currency / not_enough_stone /
  // character_not_found / txn_missing / duplicate。
  string reason = 2;
  string from_kind = 3;
  string to_kind = 4;
  int64 from_cost = 5;
  int64 to_gain = 6;
  int64 from_amount = 7;
  int64 to_amount = 8;
  int32 ratio = 9;
  // 最高一档的名字（仙晶），只作展示：它不是元宝，也不参与寄售。
  string highest_name = 10;
  bool duplicate = 11;
}

// P3-2a：灵石成交结算。成交由全局服务转过来，请求里没有档位、数量、标价或税额。
message StoneAuctionSettleRequest {
  string account = 1;
  uint64 character_id = 2;
  uint64 listing_id = 3;
  string txn_id = 4;
}

message StoneAuctionSettleResponse {
  bool ok = 1;
  string reason = 2;
  uint64 listing_id = 3;
  string stone_kind = 4;
  int64 stone_amount = 5;
  int64 price_gold = 6;
  int64 tax_gold = 7;
  int64 net_gold = 8;
  int64 buyer_gold = 9;
  int64 seller_gold = 10;
  int64 buyer_stone = 11;
  int64 seller_stone = 12;
  int32 tax_rate_pct = 13;
  string state = 14;
  bool duplicate = 15;
}


// P3-3a4：城战胜负写回。方案 11 章「阵营 · 领地（全服）：地块税收、灵石矿脉」，
// 9.5 / 12 章「掌管方按城池税收抽成，比例走配置」。开发架构第 66 行只要求把胜负
// 写回城池税收和矿脉归属：这里写的是「社交」.city 的 owner_sect（谁掌管矿脉）与
// tax_pct（掌管方抽成比例），不是发奖，也不往 city_tax_ledger 造一笔金币税——
// 城战易主本身不产生金币，账本记的是任务发放时的抽成流水。
message ApplySiegeResultRequest {
  // 服间可信调用；战斗服直连时为空，网关不转发这条。
  string account = 1;
  // 幂等号：一场城战一个号，同一号重放只回 duplicate，不写第二次。
  string txn_id = 2;
  // 由战斗服的领地表按 match 前缀给出，客户端表达不了「我要改哪座城」。
  string city_id = 3;
  // 只记账，不参与判定。
  string match_id = 4;
  // 战斗服按本场各队累计有效伤害判出的胜方队伍（服务端事实值）。
  uint32 winner_team = 5;
  // 社交服只读给回的胜方宗门编号；0 表示没宗门，角色服一律拒绝写回。
  uint64 winner_sect = 6;
}

message ApplySiegeResultResponse {
  bool ok = 1;
  // request_missing / unknown_city / winner_sect_missing / duplicate / 空串表示写回成功。
  string reason = 2;
  bool duplicate = 3;
  string city_id = 4;
  // 事务内读回的城池事实值，不是请求回声。
  string owner_sect = 5;
  int32 tax_pct = 6;
  string txn_id = 7;
}

// P3-4a2：通行证的只读状态。请求只带账号与角色号（服间可信调用），
// 季由角色服向全局服务确认，客户端表达不了「看哪一季的通行证」。
message DescribeSeasonPassRequest {
  string account = 1;
  uint64 character_id = 2;
}

// 一阶的一条奖励。物品编号、数量与领没领都是服务端事实值：
// 免费轨只有称号与外观碎片，付费轨只有当季外观、洞府摆件与保护券。
message SeasonPassReward {
  string track = 1;
  uint32 stage = 2;
  string item_id = 3;
  uint32 count = 4;
  bool claimed = 5;
  // Q6/J4：这一阶要多少点（阶号 × points_per_stage）与此刻够不够。
  // 两个都是服务端事实值：门槛来自 config/season_pass_progress.json，点数来自库里。
  uint32 required_points = 6;
  bool unlocked = 7;
}

message DescribeSeasonPassResponse {
  bool ok = 1;
  // season_unavailable（全局服务没起或没配）/ found=false 表示这一季没有通行证配置。
  string reason = 2;
  bool found = 3;
  string season_id = 4;
  // 这一季的付费轨开了没有。免费轨恒可领。
  bool paid = 5;
  // 商城里的标价，来自 config/shop.json 那条 season_pass 商品；本卡不另存价格。
  int64 price_yuanbao = 6;
  repeated SeasonPassReward rewards = 7;
  // 保护券的编号（enhance.json 的 protect_item_id）。它和商城卖的是同一种券，
  // 回包里给出来只是让界面能显示「这一阶给什么」。
  string protect_item_id = 8;
  // Q6/J4：本季已攒的点数，与每阶要多少点。领取时点数不够回 points_not_enough。
  int64 points = 9;
  int32 points_per_stage = 10;
}

// 领取只带轨与阶。季由角色服向全局服务确认，物品编号与数量全从配置读。
message ClaimSeasonPassRequest {
  string account = 1;
  uint64 character_id = 2;
  // free 或 paid。表外的轨一律拒绝。
  string track = 3;
  uint32 stage = 4;
  string txn_id = 5;
}

message ClaimSeasonPassResponse {
  bool ok = 1;
  // unknown_track / unknown_stage / pass_not_owned / already_claimed / bag_full /
  // season_unavailable / character_not_found / txn_missing / duplicate /
  // points_not_enough（Q6：本季点数不够这一阶的门槛）/ progress_table_missing。
  string reason = 2;
  string season_id = 3;
  string track = 4;
  uint32 stage = 5;
  string item_id = 6;
  uint32 count = 7;
  uint32 bag_slot = 8;
  // 通行证的奖励到账即绑；这一条恒为 true。
  bool bound = 9;
  bool duplicate = 10;
  // 领完之后这一阶是不是已领。duplicate 时也是 true。
  bool claimed = 11;
}

// P3-4b：账号级角色位。请求只有账号——名额与人数都从库里读，
// 客户端表达不了「我有几个位」，也改不动。
message DescribeCharacterSlotsRequest {
  string account = 1;
}

message DescribeCharacterSlotsResponse {
  string account = 1;
  // 配置里的基础位与上限（config/character_slot.json），改配置重启后这里能直接核对到。
  int32 base_slots = 2;
  int32 max_slots = 3;
  // 库里记的总名额。没有那一行就是 base_slots（老账号按基础位算）。
  int32 slots = 4;
  // 已经建了几个角色。前面两个都是事实值，不在这里算「还能建几个」。
  int32 used = 5;
  // 第二角色栏这条商品的编号与标价，来自 config/shop.json；本服务不另存价格。
  string product_id = 6;
  int64 price_yuanbao = 7;
}

// P3-4b：外观收藏。按账号取，不按角色：同账号下任一角色持有的外观类物品都算。
message DescribeWardrobeRequest {
  string account = 1;
}

message WardrobeEntry {
  string item_id = 1;
  string kind = 2;
  string name = 3;
  // 这一件在哪些角色身上（只给编号，便于核对「共享的是收藏、不是装备」）。
  repeated uint64 character_ids = 4;
}

message DescribeWardrobeResponse {
  string account = 1;
  bool found = 2;
  // 外观类物品的并集，按物品编号稳定排序。装备 / 强化 / 等级 / 境界一条都不在这里。
  repeated WardrobeEntry entries = 3;
}

// C1：主线十二场。剧情进度只记在角色上（创建时 main_stage 与 alignment 都为空），
// 战斗进程不保存剧情进度；下一场由角色服从库里的 main_stage 算，客户端表达不了。
message DescribeMainlineRequest {
  string account = 1;
  uint64 character_id = 2;
}

message DescribeMainlineResponse {
  uint64 character_id = 1;
  bool found = 2;
  // coalesce(main_stage, 0)：0 表示一场都还没交。
  int32 main_stage = 3;
  string alignment = 4;
  // 下一场编号。个人线停在第 12 场，走到尽头回 0；配置缺表也回 0。
  int32 next_stage = 5;
  int32 stage_count = 6;
  bool config_missing = 7;
  // 只读事实值：门槛由服务端判，不在这里给客户端自己算。
  int32 level = 8;
  string realm = 9;
}

message TurnInMainlineRequest {
  string account = 1;
  uint64 character_id = 2;
  // 网关生成的 P1-1b5 幂等号；同一个号再提交，整笔不做。
  string txn_id = 3;
  int32 stage = 4;
  // 只有第 10 场能填「立仙」或「立魔」，其它场必须为空。
  string alignment = 5;
}

message TurnInMainlineResponse {
  bool ok = 1;
  string reason = 2;
  bool duplicate = 3;
  int32 stage = 4;
  // 库里读回的事实值，不是请求带进来的值。
  int32 main_stage = 5;
  string alignment = 6;
  string txn_id = 7;
}

// K3：一条配方的材料。物品编号与件数只从 config/recipes.json 来；请求里没有这两个字段。
message RecipeInput {
  string item_id = 1;
  int32 count = 2;
}

// K3：一条配方的产出。
message RecipeOutput {
  string item_id = 1;
  int32 count = 2;
}

// K3：一条配方的费用。币种必须在 currency.json；数量是非负整数。
message RecipeFeeLine {
  string kind = 1;
  int64 amount = 2;
}

// K3：目录里的一条配方。unlocked 是按角色当前等级算的展示事实，
// 判定仍在角色服；客户端不拿它自己算能不能做。
message RecipeFact {
  string id = 1;
  string profession = 2;
  int32 unlock_level = 3;
  bool unlocked = 4;
  repeated RecipeInput inputs = 5;
  repeated RecipeFeeLine fee = 6;
  RecipeOutput output = 7;
  double success_pct = 8;
  int32 craft_time_s = 9;
  string note = 10;
}

message DescribeRecipesRequest {
  string account = 1;
  uint64 character_id = 2;
}

// K3：副职编号与名字。名字只在 recipes.json，代码不写第二份。
message RecipeProfession {
  string id = 1;
  string name = 2;
}

message DescribeRecipesResponse {
  bool ok = 1;
  string reason = 2;
  int32 table_version = 3;
  bool pending = 4;
  // 角色当前等级；只用于给 unlocked 一个可核对的口径，不参与请求。
  int32 level = 5;
  repeated RecipeProfession professions = 6;
  repeated RecipeFact recipes = 7;
}

message StartCraftRequest {
  string account = 1;
  uint64 character_id = 2;
  string recipe_id = 3;
  // 网关生成，同一笔不会扣两次材料。
  string txn_id = 4;
}

message StartCraftResponse {
  // 业务前提不满足（unknown_recipe / level_too_low / material_insufficient /
  // fee_insufficient / bag_full / craft_in_progress / duplicate）是正常回包里的
  // ok=false + reason；身份与参数错才走 gRPC 错误码。拒绝时下面的事实值一律留 0 / 空串。
  bool ok = 1;
  string reason = 2;
  bool duplicate = 3;
  string recipe_id = 4;
  string profession = 5;
  int32 craft_time_s = 6;
  int64 started_at_unix = 7;
  int64 ready_at_unix = 8;
  int32 remaining_s = 9;
}

message FinishCraftRequest {
  string account = 1;
  uint64 character_id = 2;
  // 网关生成；同一个号再提交，一笔不做。
  string txn_id = 3;
}

message FinishCraftResponse {
  // 业务前提不满足（no_craft / craft_not_ready / bag_full / recipe_unknown / duplicate）
  // 是 ok=false；真的做了但掷点失败是 ok=true + success=false（材料照扣、产出为 0）。
  bool ok = 1;
  string reason = 2;
  bool duplicate = 3;
  string recipe_id = 4;
  string profession = 5;
  bool success = 6;
  string output_item_id = 7;
  int32 output_count = 8;
  // 只作展示：这一手按配置的成功率，客户端不拿它算结果。
  double success_pct = 9;
  int32 craft_time_s = 10;
  int64 ready_at_unix = 11;
  // B3：这一手掷出来的主属性（含附加 attack 之和的口径见 CraftExtra）。产出不是装备、
  // 或者这一手没成，craft_attr 留 0、craft_extras 为空。同一件装备只掷这一次，
  // 客户端只展示，不能拿去算伤害（伤害仍走 DescribeBattleProfile 的快照）。
  int32 craft_attr = 12;
  repeated CraftExtra craft_extras = 13;
}

// B3：制作掷点的一条附加属性。种类只从该部位 × 该品阶的允许表里来
// （config/craft_roll.json 的 extras），当前只有 attack 一种。
message CraftExtra {
  string attr = 1;
  int32 value = 2;
}

message DescribeCraftRequest {
  string account = 1;
  uint64 character_id = 2;
}

message DescribeCraftResponse {
  bool ok = 1;
  string reason = 2;
  bool active = 3;
  string recipe_id = 4;
  string profession = 5;
  int32 craft_time_s = 6;
  int64 started_at_unix = 7;
  int64 ready_at_unix = 8;
  int32 remaining_s = 9;
}

// Q5/J2：一条任务的奖励行。币种只能是灵石五档（config/stone_exchange.json），
// 数量来自 config/city_tasks.json；请求里两个字段都带不进来。
message CityTaskRewardFact {
  string currency = 1;
  int64 amount = 2;
}

// Q5/J2：面板上一条任务的事实值。done 是这一周期已完成的次数，period_key 是
// 业务日（日常）或业务周首（周常），都由服务端按日历算；eligible 是服务端按
// 库里的 level / realm 判出来的展示事实，客户端不拿它自己算能不能做。
message CityTaskFact {
  string task_id = 1;
  string name = 2;
  string city_id = 3;
  string period = 4;
  int32 done = 5;
  int32 max_per_period = 6;
  // 0 表示不卡等级。
  int32 require_level = 7;
  // 空串表示不卡境界。
  string require_realm = 8;
  repeated CityTaskRewardFact rewards = 9;
  string period_key = 10;
  bool eligible = 11;
}

// Q5/J2：面板上的一个灵石档位余额（只返回本表实际用到的档位）。
message CityCurrencyBalance {
  string kind = 1;
  int64 amount = 2;
}

message DescribeCityTasksRequest {
  string account = 1;
  uint64 character_id = 2;
}

message DescribeCityTasksResponse {
  bool ok = 1;
  // character_not_found 是正常回包里的 ok=false；身份与参数错才走 gRPC 错误码。
  string reason = 2;
  uint64 character_id = 3;
  int32 level = 4;
  string realm = 5;
  int32 table_version = 6;
  bool pending = 7;
  // 角色服没加载到任务表时为 true：面板空、完成一律拒绝，不编内容。
  bool config_missing = 8;
  repeated CityTaskFact tasks = 9;
  repeated CityCurrencyBalance stones = 10;
}

// Q5/J2：这一笔实际发出去的灵石。before / after 是库里的事实值，
// tax_amount 是按城池税率算出的抽成（只记账、不从玩家扣）。
message CityTaskGrantFact {
  string currency = 1;
  int64 amount = 2;
  int64 balance_before = 3;
  int64 balance_after = 4;
  int64 tax_amount = 5;
}

message CompleteCityTaskRequest {
  string account = 1;
  uint64 character_id = 2;
  // 网关生成的 P1-1b5 幂等号；同一个号再提交，整笔不做。
  string txn_id = 3;
  string task_id = 4;
}

message CompleteCityTaskResponse {
  // task_unknown / duplicate / character_not_found / level_too_low /
  // realm_too_low / limit_reached / city_missing 是 ok=false + reason；
  // 拒绝时下面的事实值一律留 0 / 空串。
  bool ok = 1;
  string reason = 2;
  bool duplicate = 3;
  string task_id = 4;
  string city_id = 5;
  int32 done = 6;
  int32 max_per_period = 7;
  string period_key = 8;
  repeated CityTaskGrantFact grants = 9;
  string txn_id = 10;
  // 这一笔用的城池抽成比例（库里「社交」.city.tax_pct 的事实值）。
  int32 tax_pct = 11;
}

// Q9/H4：记一次逃跑。战斗服判出「主动退」或「重连窗口到了还没回来」时发一次。
// penalty_ms 从战斗服的 config/reconnect.json 读出来传进来——角色服不读那份配置，
// 也不相信客户端；到期时刻由角色服按自己的时钟算。
message RecordDeserterRequest {
  uint64 character_id = 1;
  // 判出这件事的那一场。只用于追查，不参与判定、不进奖励。
  uint64 session_id = 2;
  // voluntary（主动退） / timeout（窗口到点没回来）。只允许这两个值。
  string reason = 3;
  // 要等多久（毫秒）。<= 0 时按「不惩罚」处理，写都不写。
  int64 penalty_ms = 4;
}

message RecordDeserterResponse {
  bool ok = 1;
  string reason = 2;
  // 从这一刻起还要等多久。角色库里已有的到期时刻更晚时不覆盖（取较晚的）。
  int64 remaining_ms = 3;
  int64 until_ms = 4;
  uint64 session_id = 5;
}

// Q9/H4：这个角色现在能不能进本。只读，不写库、不改任何事实值。
message DescribeDeserterRequest {
  uint64 character_id = 1;
}

message DescribeDeserterResponse {
  bool ok = 1;
  // 0 表示没被罚或者已经过期。
  int64 remaining_ms = 2;
  int64 until_ms = 3;
  // 最近一次判罚的场次与原因；没被罚过时是 0 / 空串。
  uint64 session_id = 4;
  string reason = 5;
}

// ---------------------------------------------------------------------------
// K2+Q13：NPC 商店（城镇 / 宗门）+ 出售 / 回购 / 修理。
//
// 面板上的每个数都从角色服的配置与库里来：货架由 config/npc_shop.json 的 shops 段驱动，
// 今日剩多少 / 今天买了几件是库里的计数，回收价与回购窗口是同一份文件的 sell / buyback，
// 耐久上限与修理单价是 repair 段。客户端一个数都带不进来，也不自己算钱。
// ---------------------------------------------------------------------------

message DescribeNpcShopRequest {
  uint64 character_id = 1;
  // npc.json 里那位 NPC 的 shop_id。空串表示按 NPC 找店，客户端不带第二套编号。
  string shop_id = 2;
}

message NpcShopGoods {
  string item_id = 1;
  string name = 2;
  int64 price = 3;
  // 今日还剩几件。unlimited=true 时这个数是 0、不代表卖完。
  int32 stock_left = 4;
  bool unlimited = 5;
  int32 bought_today = 6;
  // 0 表示不限购。
  int32 limit_per_character = 7;
  bool enough = 8;
  bool sold_out = 9;
  bool limit_reached = 10;
}

message NpcShopSellLine {
  string item_id = 1;
  string name = 2;
  // NPC 回收单价。卖出得多少由服务端按「单价 × 件数」算，回包里给结果。
  int64 price = 3;
}

message NpcShopBuybackRow {
  int64 id = 1;
  string item_id = 2;
  string name = 3;
  int32 count = 4;
  // 回购单价（按卖出时的卖价与配置倍率算好落库），不是现在的卖价。
  int64 unit_price = 5;
  int64 sold_at_ms = 6;
}

message NpcShopWornRow {
  string slot = 1;
  string item_id = 2;
  string name = 3;
  // 当前耐久。等于上限表示没损耗（库里 NULL 也回成上限）。
  int32 durability = 4;
  int32 durability_max = 5;
}

message DescribeNpcShopResponse {
  bool ok = 1;
  // shop_unknown（没有这家店）/ npc_unknown（这家店没挂 NPC）。
  string reason = 2;
  string shop_id = 3;
  string npc_id = 4;
  string currency = 5;
  string refresh = 6;
  int64 balance = 7;
  repeated NpcShopGoods goods = 8;
  repeated NpcShopSellLine sell = 9;
  // 回收用的币种余额（与货架币种分开回，两个数都照实给）。
  int64 sell_balance = 10;
  repeated NpcShopBuybackRow buyback = 11;
  int64 repair_price_per_point = 12;
  string repair_currency = 13;
  repeated NpcShopWornRow worn = 14;
}

message BuyNpcShopItemRequest {
  uint64 character_id = 1;
  string shop_id = 2;
  // 只带商品编号：标价、库存、限购全按配置与库里的计数判。
  string item_id = 3;
  // 网关生成的幂等号，前缀 npc_shop_buy:。
  string txn_id = 4;
}

message BuyNpcShopItemResponse {
  bool ok = 1;
  // item_not_in_shop / stock_out / limit_reached / not_enough_gold / bag_full /
  // duplicate（同一事务号第二次来）/ 空串表示成交。
  string reason = 2;
  string shop_id = 3;
  string item_id = 4;
  string name = 5;
  string currency = 6;
  int64 price = 7;
  int64 balance = 8;
  int32 stock_left = 9;
  int32 bought_today = 10;
  int32 limit_per_character = 11;
  // 东西落到第几格。没成交为 0。
  int32 bag_slot = 12;
  int32 count = 13;
  bool bound = 14;
  bool duplicate = 15;
}

message SellNpcItemRequest {
  uint64 character_id = 1;
  string shop_id = 2;
  // 卖第几格、几件。卖哪件由服务端按格子里的现状判，白名单外一律拒。
  int32 bag_slot = 3;
  int32 count = 4;
  string txn_id = 5;
}

message SellNpcItemResponse {
  bool ok = 1;
  // item_not_in_bag / not_sellable / equipped / count_invalid / duplicate。
  string reason = 2;
  string shop_id = 3;
  // 这一笔的回购号，随后要回购就用它；没成交为 0。
  int64 buyback_id = 4;
  string item_id = 5;
  string name = 6;
  int32 count = 7;
  int64 unit_price = 8;
  // 这一笔真加的金币。没成交恒为 0。
  int64 gained = 9;
  string currency = 10;
  int64 balance = 11;
  int32 bag_slot = 12;
  bool duplicate = 13;
}

message BuybackNpcItemRequest {
  uint64 character_id = 1;
  string shop_id = 2;
  int64 buyback_id = 3;
  string txn_id = 4;
}

message BuybackNpcItemResponse {
  bool ok = 1;
  // buyback_empty（没有这条 / 已回购 / 过期）/ not_enough_gold / bag_full / duplicate。
  string reason = 2;
  int64 buyback_id = 3;
  string item_id = 4;
  string name = 5;
  int32 count = 6;
  int64 unit_price = 7;
  // 这一笔真扣的金币。没成交恒为 0。
  int64 paid = 8;
  string currency = 9;
  int64 balance = 10;
  int32 bag_slot = 11;
  bool duplicate = 12;
}

message RepairNpcEquipmentRequest {
  uint64 character_id = 1;
  // 网关生成的幂等号，前缀 npc_shop_repair:。
  string txn_id = 2;
}

message NpcRepairRow {
  string slot = 1;
  string item_id = 2;
  int32 before = 3;
  int32 after = 4;
  int32 max = 5;
}

message RepairNpcEquipmentResponse {
  bool ok = 1;
  // not_equipment（身上没装备）/ durability_full（都满着）/ not_enough_gold / duplicate。
  string reason = 2;
  // 这一笔真扣的金币。没成交恒为 0。
  int64 charged = 3;
  string currency = 4;
  int64 balance = 5;
  repeated NpcRepairRow repaired = 6;
  bool duplicate = 7;
}

// B4：玩法坐骑。只差移动速度，档位 / 加成 / 拒绝码口径见 config/mount.json。
message MountUpRequest {
  string account = 1;
  uint64 character_id = 2;
  // 骑的是哪一格背包。
  uint32 bag_slot = 3;
}

message DismountRequest {
  string account = 1;
  uint64 character_id = 2;
}

message MountResponse {
  bool ok = 1;
  // character_not_found / slot_empty / not_a_mount / already_mounted / mount_occupied / not_mounted。
  string reason = 2;
  string item_id = 3;
  // normal / advanced，来自 config/mount.json；拒绝时回空串。
  string tier = 4;
  int32 speed_bps = 5;
  uint32 bag_slot = 6;
}

message DescribeMountRequest {
  string account = 1;
  uint64 character_id = 2;
}

// 背包里的一只坐骑。mounted 表示现在骑着的是这一只。
message MountFact {
  string item_id = 1;
  string name = 2;
  string tier = 3;
  int32 speed_bps = 4;
  uint32 bag_slot = 5;
  bool mounted = 6;
}

message DescribeMountResponse {
  bool found = 1;
  // 没骑时这两个字段回空串与 0，不表示错误。
  string equipped_item_id = 2;
  int32 equipped_speed_bps = 3;
  repeated MountFact owned = 4;
}

// B4：灵兽只做收集 / 外观 / 生活协助，不进入伤害公式。
message DescribeSpiritBeastRequest {
  string account = 1;
  uint64 character_id = 2;
}

message SpiritBeastFact {
  string item_id = 1;
  string name = 2;
  // normal / advanced / divine。
  string tier = 3;
  // 收集口径与外观收藏一致：背包现在持有就是 true。
  bool collected = 4;
  int32 life_assist_pct_bps = 5;
}

message DescribeSpiritBeastResponse {
  bool found = 1;
  int32 collected_count = 2;
  int32 entry_count = 3;
  // 收集度万分比：collected_count / entry_count * 10000。
  int32 collection_pct_bps = 4;
  int32 total_life_assist_pct_bps = 5;
  string passive_kind = 6;
  repeated SpiritBeastFact entries = 7;
}

// B5 摆摊：开摊。地表、坐标与招牌由客户端带；等级门槛、格数、税率与
// 「一个摊主同时只开一个摊」都由角色服从库和 config/stall.json 判。
message OpenStallRequest {
  string account = 1;
  uint64 character_id = 2;
  string region_id = 3;
  double pos_x = 4;
  double pos_y = 5;
  string title = 6;
  // 由网关生成：同一个号重放只回上一次的摊位，不会开两个。
  string txn_id = 7;
  // 网关预先生成的摊位号；重放时按它找回同一行。
  string stall_id = 8;
}

message OpenStallResponse {
  // level_too_low / stall_exists / character_not_found / bad_title / region_missing
  bool ok = 1;
  string reason = 2;
  string stall_id = 3;
  string owner_name = 4;
  string region_id = 5;
  double pos_x = 6;
  double pos_y = 7;
  string title = 8;
  int32 live_listings = 9;
  int32 slots = 10;
  int32 min_level = 11;
  int32 tax_rate_pct = 12;
}

// 关摊：在售的挂单同时撤掉（state = 'cancelled'），物品不搬、仍留在卖方那一格。
message CloseStallRequest {
  string account = 1;
  uint64 character_id = 2;
  string stall_id = 3;
  string txn_id = 4;
}

message CloseStallResponse {
  // stall_not_found / not_owner / stall_closed
  bool ok = 1;
  string reason = 2;
  string stall_id = 3;
  int32 cancelled_listings = 4;
}

// 上架：只带摊位、背包格、数量与金币一口价。物品编号、摊主、在售件数从库里读。
message ListStallItemRequest {
  string account = 1;
  uint64 character_id = 2;
  string stall_id = 3;
  uint32 slot = 4;
  uint32 count = 5;
  int64 price_gold = 6;
  string txn_id = 7;
}

message ListStallItemResponse {
  // stall_not_found / not_owner / stall_closed / stall_full / slot_empty /
  // slot_listed / price_invalid / count_invalid
  bool ok = 1;
  string reason = 2;
  uint64 listing_id = 3;
  string stall_id = 4;
  uint32 slot = 5;
  string item_id = 6;
  uint32 count = 7;
  int64 price_gold = 8;
  int32 live_listings = 9;
  int32 slots = 10;
}

message StallListingFact {
  uint64 listing_id = 1;
  uint32 slot = 2;
  string item_id = 3;
  string item_name = 4;
  uint32 count = 5;
  int64 price_gold = 6;
  bool bound = 7;
}

// 看摊：只读。买家看到的就是卖家挂上的那几行，价格与数量都由服务端读。
message ViewStallRequest {
  string stall_id = 1;
}

message ViewStallResponse {
  bool found = 1;
  string stall_id = 2;
  uint64 owner_id = 3;
  string owner_name = 4;
  string region_id = 5;
  double pos_x = 6;
  double pos_y = 7;
  string title = 8;
  string state = 9;
  int32 live_listings = 10;
  int32 slots = 11;
  repeated StallListingFact listings = 12;
}

// B11：竞技场一场通关。outcome 目前只认 win——散场（没打完）不记分、
// 也不扣分，方案没写失败惩罚，这里不自编一套。
message ReportArenaResultRequest {
  // 服间直连（战斗服）为空；网关转发时才填，客户端填不了。
  string account = 1;
  uint64 character_id = 2;
  // 幂等号：一场一个人一个号，同一个号重放不再加分。
  string txn_id = 3;
  // 竞技场模式（config/arena_match.json 的 modes[].id），只记账、不参与判定。
  string mode = 4;
  string outcome = 5;
}

message ReportArenaResultResponse {
  bool ok = 1;
  string reason = 2;
  string season_id = 3;
  int64 score = 4;
  int64 score_delta = 5;
  string tier_key = 6;
  string tier_name = 7;
  // 这一场把档位抬上去了没有；外观仍要单独领，本笔只记分。
  bool tier_up = 8;
  int32 wins = 9;
  bool duplicate = 10;
}

message DescribeArenaRankRequest {
  uint64 character_id = 1;
}

message ArenaRankTierFact {
  string key = 1;
  string name = 2;
  int64 min_score = 3;
  string appearance_item_id = 4;
  // reached 只看库里记下的分数；claimed 看库里有没有领过这一档。
  bool reached = 5;
  bool claimed = 6;
}

message DescribeArenaRankResponse {
  bool ok = 1;
  string reason = 2;
  string season_id = 3;
  int64 score = 4;
  string tier_key = 5;
  string tier_name = 6;
  int32 wins = 7;
  // 已经到顶时 next_tier_key 为空、next_tier_min_score = 0。
  string next_tier_key = 8;
  int64 next_tier_min_score = 9;
  repeated ArenaRankTierFact tiers = 10;
}

message ClaimArenaAppearanceRequest {
  string account = 1;
  uint64 character_id = 2;
  string tier_key = 3;
  string txn_id = 4;
}

message ClaimArenaAppearanceResponse {
  bool ok = 1;
  string reason = 2;
  string season_id = 3;
  string tier_key = 4;
  string item_id = 5;
  uint32 bag_slot = 6;
  bool duplicate = 7;
}

message DescribeArenaLeaderboardRequest {
  // 0 表示按配置的 top_n；大于它按配置截断。
  uint32 limit = 1;
}

message ArenaLeaderboardEntry {
  uint32 rank = 1;
  uint64 character_id = 2;
  string name = 3;
  string class_id = 4;
  int64 score = 5;
  string tier_key = 6;
  string tier_name = 7;
}

message DescribeArenaLeaderboardResponse {
  bool ok = 1;
  string reason = 2;
  string season_id = 3;
  uint32 limit = 4;
  repeated ArenaLeaderboardEntry entries = 5;
}
