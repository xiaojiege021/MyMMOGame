syntax = "proto3";

package mmo.world;
option csharp_namespace = "Mmo.Proto.World";

// 表世界的分线（P1-3a1）、位置流（P1-3a2）、同屏档位（P1-3a3）、采集（P1-3b）
// 与飞行跨区（P1-3c）。世界服是分线、位置、档位、飞行状态与采集节点占用的唯一
// 写入方；这些都是在线状态，放进程内存，不落库。境界本身在角色服，世界服只读不写。
// AOI、表世界技能结算与境界突破不在这里。
service WorldService {
  rpc EnterLine(EnterLineRequest) returns (EnterLineResponse);
  rpc LeaveLine(LeaveLineRequest) returns (LeaveLineResponse);
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);

  // 手机到网关一条 WebSocket，网关到世界服一条 gRPC 双向流。
  // 账号与角色编号由网关放进请求头，客户端帧里带不进身份、分线号或别人的坐标。
  rpc PositionStream(stream WorldClientFrame) returns (stream WorldServerFrame);

  // 采矿与采药。成功与否、节点占用与刷新都由世界服判；产物交给角色服写背包。
  // 灵石矿脉不是个人采集点，对它的请求一律拒绝（方案 9.5）。
  rpc Gather(GatherRequest) returns (GatherResponse);

  // 飞行与跨区。世界服先问角色服的境界，再按 config/flight.json 的门槛判定；
  // 权限不够就把人拉回地面 / 留在原区域，不在客户端上改权限。
  rpc Fly(FlyRequest) returns (FlyResponse);
  rpc CrossRegion(CrossRegionRequest) returns (CrossRegionResponse);
}

// 请求里没有分线号、人数、容量或区域配置：客户端改包改不了自己被分到哪条线。
// display_name 是网关复核归属后从角色服取的只读名字，只走服与服这一段，
// 客户端的 HTTP 请求体不带这个字段。
message EnterLineRequest {
  string account = 1;
  uint64 character_id = 2;
  string region_id = 3;
  string display_name = 4;
}

message EnterLineResponse {
  bool entered = 1;
  string reason = 2;
  string line_id = 3;
  string region_id = 4;
  uint32 line_no = 5;
  uint32 line_size = 6;
  uint32 line_capacity = 7;
  bool duplicate = 8;
  repeated string neighbors = 9;
  repeated string dialogue_ids = 10;
}

message LeaveLineRequest {
  string account = 1;
  uint64 character_id = 2;
}

message LeaveLineResponse {
  bool left = 1;
  string line_id = 2;
  uint32 line_size = 3;
}

message ListRegionsRequest {}

message RegionInfo {
  string id = 1;
  string name = 2;
  repeated uint32 chapters = 3;
  repeated string neighbors = 4;
  repeated string dialogue_ids = 5;
  bool open = 6;
}

// 地点与开口的人的编号都从方案正文 2.5 到 2.7 读出来，供客户端与核对比对。
message ListRegionsResponse {
  uint32 version = 1;
  repeated RegionInfo regions = 2;
  repeated string speakers = 3;
  repeated string factions = 4;
}

// 一条 WebSocket 上跑位置帧，靠信封分辨。客户端只上报自己的坐标与朝向，
// 没有 account / character_id / line_id / line_size / 别人的位置 / 档位 / 名字这些字段。
message WorldClientFrame {
  oneof body {
    PositionReport position = 1;
  }
}

message PositionReport {
  float x = 1;
  float y = 2;
  float z = 3;
  float facing = 4;
  uint64 seq = 5;
}

message WorldServerFrame {
  oneof body {
    PositionSnapshot snapshot = 1;
    PositionRejected rejected = 2;
  }
}

// 方案写定的同屏三档。档位由世界服按距离算，客户端只按它决定画什么，
// 不在手机上自行决定远处的人该不该画全。两档距离在 config/world.json。
enum AppearanceTier {
  APPEARANCE_TIER_UNSPECIFIED = 0;
  APPEARANCE_TIER_FULL = 1;
  APPEARANCE_TIER_SIMPLE = 2;
  APPEARANCE_TIER_NAME = 3;
}

// 周围的人：同一条分线里的其他成员。这一行不做 AOI、距离裁剪和按档位删人，
// 全量名单照推，只是每个人多带一个服务端算出的档位与名字牌文本。
message AvatarPosition {
  uint64 character_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float facing = 5;
  uint64 seq = 6;
  AppearanceTier appearance_tier = 7;
  string display_name = 8;
  // 技术架构第 4 节写定的少量状态。由世界服判完后随快照下发，
  // 客户端上报帧里没有这两个字段，改包也改不了别人看到的状态。
  bool flying = 9;
  bool can_fly = 10;
}

message PositionSnapshot {
  string line_id = 1;
  string region_id = 2;
  uint64 server_time_ms = 3;
  uint32 sync_hz = 4;
  repeated AvatarPosition avatars = 5;
  uint64 self_character_id = 6;
  bool self_flying = 7;
  bool self_can_fly = 8;
}

// 服务端校验不通过时把上一次合法位置回给自己，别人看到的仍是那一份。
message PositionRejected {
  string reason = 1;
  AvatarPosition corrected = 2;
}

// 采集请求走网关的一条 HTTP，网关认令牌并复核归属后填 account / character_id。
// 客户端只给节点编号：产物、数量、背包格、事务号、身份、分线号都带不进请求。
message GatherRequest {
  string account = 1;
  uint64 character_id = 2;
  string node_id = 3;
}

// 被拒绝时 ok=false，未生效的 item_id / count / bag_slot / txn_id 一律是 0 或空。
// 世界服不直接写角色库：成功的一笔由角色服的 ApplyGrant 落库，txn_id 用过就不能再用。
message GatherResponse {
  bool ok = 1;
  string reason = 2;
  string node_id = 3;
  string kind = 4;
  string item_id = 5;
  int32 count = 6;
  uint32 bag_slot = 7;
  string txn_id = 8;
  bool duplicate = 9;
  int32 respawn_s = 10;
}

// 客户端只给「想不想飞」。账号由网关从令牌取，境界由世界服问角色服，
// 两个值都不在这个请求里；塞 can_fly / realm / account 也不会被读。
message FlyRequest {
  string account = 1;
  uint64 character_id = 2;
  bool want_fly = 3;
}

// 权限不够时 ok=false，flying=false，y 是拉回后的地面高度（沿用 world.json 的 spawn_y）。
// realm / required_realm 是只读展示，客户端不能提交，也不是判定依据。
message FlyResponse {
  bool ok = 1;
  string reason = 2;
  bool flying = 3;
  bool can_fly = 4;
  string realm = 5;
  string required_realm = 6;
  float y = 7;
}

// 跨区只给目标地点编号。当前区域由 LineRegistry 的分线注册表给，
// 相连关系、是否开放与境界门槛都由世界服从配置读，客户端带不进。
message CrossRegionRequest {
  string account = 1;
  uint64 character_id = 2;
  string target_region = 3;
}

// 被拉回时 region_id 是原来那块地表，line_id 是原来那条分线，都没变。
message CrossRegionResponse {
  bool ok = 1;
  string reason = 2;
  string region_id = 3;
  string line_id = 4;
  uint32 line_no = 5;
  string realm = 6;
  string required_realm = 7;
}
