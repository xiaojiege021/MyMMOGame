syntax = "proto3";

package mmo.world;
option csharp_namespace = "Mmo.Proto.World";

// 表世界的分线（P1-3a1）、位置流（P1-3a2）与同屏档位（P1-3a3）。
// 世界服是分线、位置与档位的唯一写入方；在线状态、坐标与档位都在进程内存，不落库。
// 采集、飞行状态与 AOI 不在这里。
service WorldService {
  rpc EnterLine(EnterLineRequest) returns (EnterLineResponse);
  rpc LeaveLine(LeaveLineRequest) returns (LeaveLineResponse);
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);

  // 手机到网关一条 WebSocket，网关到世界服一条 gRPC 双向流。
  // 账号与角色编号由网关放进请求头，客户端帧里带不进身份、分线号或别人的坐标。
  rpc PositionStream(stream WorldClientFrame) returns (stream WorldServerFrame);
}

// 请求里没有分线号、人数、容量或区域配置：客户端改包改不了自己被分到哪条线。
// display_name 是网关复核归属后从角色服取的只读名字，只走服与服这一段，
// 客户端的 HTTP 请求体不带这个字段。
message EnterLineRequest {
  string account = 1;
  uint64 character_id = 2;
  string region_id = 3;
  string display_name = 4;
}

message EnterLineResponse {
  bool entered = 1;
  string reason = 2;
  string line_id = 3;
  string region_id = 4;
  uint32 line_no = 5;
  uint32 line_size = 6;
  uint32 line_capacity = 7;
  bool duplicate = 8;
  repeated string neighbors = 9;
  repeated string dialogue_ids = 10;
}

message LeaveLineRequest {
  string account = 1;
  uint64 character_id = 2;
}

message LeaveLineResponse {
  bool left = 1;
  string line_id = 2;
  uint32 line_size = 3;
}

message ListRegionsRequest {}

message RegionInfo {
  string id = 1;
  string name = 2;
  repeated uint32 chapters = 3;
  repeated string neighbors = 4;
  repeated string dialogue_ids = 5;
  bool open = 6;
}

// 地点与开口的人的编号都从方案正文 2.5 到 2.7 读出来，供客户端与核对比对。
message ListRegionsResponse {
  uint32 version = 1;
  repeated RegionInfo regions = 2;
  repeated string speakers = 3;
  repeated string factions = 4;
}

// 一条 WebSocket 上跑位置帧，靠信封分辨。客户端只上报自己的坐标与朝向，
// 没有 account / character_id / line_id / line_size / 别人的位置 / 档位 / 名字这些字段。
message WorldClientFrame {
  oneof body {
    PositionReport position = 1;
  }
}

message PositionReport {
  float x = 1;
  float y = 2;
  float z = 3;
  float facing = 4;
  uint64 seq = 5;
}

message WorldServerFrame {
  oneof body {
    PositionSnapshot snapshot = 1;
    PositionRejected rejected = 2;
  }
}

// 方案写定的同屏三档。档位由世界服按距离算，客户端只按它决定画什么，
// 不在手机上自行决定远处的人该不该画全。两档距离在 config/world.json。
enum AppearanceTier {
  APPEARANCE_TIER_UNSPECIFIED = 0;
  APPEARANCE_TIER_FULL = 1;
  APPEARANCE_TIER_SIMPLE = 2;
  APPEARANCE_TIER_NAME = 3;
}

// 周围的人：同一条分线里的其他成员。这一行不做 AOI、距离裁剪和按档位删人，
// 全量名单照推，只是每个人多带一个服务端算出的档位与名字牌文本。
message AvatarPosition {
  uint64 character_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float facing = 5;
  uint64 seq = 6;
  AppearanceTier appearance_tier = 7;
  string display_name = 8;
}

message PositionSnapshot {
  string line_id = 1;
  string region_id = 2;
  uint64 server_time_ms = 3;
  uint32 sync_hz = 4;
  repeated AvatarPosition avatars = 5;
  uint64 self_character_id = 6;
}

// 服务端校验不通过时把上一次合法位置回给自己，别人看到的仍是那一份。
message PositionRejected {
  string reason = 1;
  AvatarPosition corrected = 2;
}
