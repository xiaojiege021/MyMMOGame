syntax = "proto3";

package mmo.world;
option csharp_namespace = "Mmo.Proto.World";

// 表世界的分线（P1-3a1）、位置流（P1-3a2）、同屏档位（P1-3a3）、采集（P1-3b）
// 与飞行跨区（P1-3c）。世界服是分线、位置、档位、飞行状态与采集节点占用的唯一
// 写入方；这些都是在线状态，放进程内存，不落库。境界本身在角色服，世界服只读不写。
// AOI、表世界技能结算与境界突破不在这里。
service WorldService {
  rpc EnterLine(EnterLineRequest) returns (EnterLineResponse);
  rpc LeaveLine(LeaveLineRequest) returns (LeaveLineResponse);
  rpc ListRegions(ListRegionsRequest) returns (ListRegionsResponse);

  // 只读采集节点表。节点全集由世界服按基准表与铺开表合并后给出；
  // 请求是空的，客户端带不进节点编号、产物或数量。
  rpc ListGatherNodes(ListGatherNodesRequest) returns (ListGatherNodesResponse);

  // 手机到网关一条 WebSocket，网关到世界服一条 gRPC 双向流。
  // 账号与角色编号由网关放进请求头，客户端帧里带不进身份、分线号或别人的坐标。
  rpc PositionStream(stream WorldClientFrame) returns (stream WorldServerFrame);

  // 采矿与采药。成功与否、节点占用与刷新都由世界服判；产物交给角色服写背包。
  // 灵石矿脉不是个人采集点，对它的请求一律拒绝（方案 9.5）。
  rpc Gather(GatherRequest) returns (GatherResponse);

  // 飞行与跨区。世界服先问角色服的境界，再按 config/flight.json 的门槛判定；
  // 权限不够就把人拉回地面 / 留在原区域，不在客户端上改权限。
  rpc Fly(FlyRequest) returns (FlyResponse);
  rpc CrossRegion(CrossRegionRequest) returns (CrossRegionResponse);

  // P3-5a：世界 Boss 的地表入口。什么时候出现、这一刻是哪一场、最多几个人、
  // 上一场把名字记在入口上的是哪个宗门，全部由世界服按 config/world_boss.json
  // 与自己这一份服务端时钟判定；请求是空的，时刻、场次编号、上限、归属都带不进来。
  // 入口关着就说关着（还没到点 / 这一场已经打掉 / 表没配），不返回「下一个可进的地方」。
  rpc DescribeWorldBoss(DescribeWorldBossRequest) returns (DescribeWorldBossResponse);

  // P3-5a：战斗服把这一场的事实值交回入口：打掉没打掉、伤害最高的宗门是谁。
  // 世界服只关入口、记名字，不加属性、不改税收、不碰灵石矿脉，也不写任何库表。
  // 同一个场次只记一次（场次编号 + 事务号挡重放）。
  rpc RecordWorldBossOwner(RecordWorldBossOwnerRequest) returns (RecordWorldBossOwnerResponse);
}

// 请求里没有分线号、人数、容量或区域配置：客户端改包改不了自己被分到哪条线。
// display_name 是网关复核归属后从角色服取的只读名字，只走服与服这一段，
// 客户端的 HTTP 请求体不带这个字段。
message EnterLineRequest {
  string account = 1;
  uint64 character_id = 2;
  string region_id = 3;
  string display_name = 4;
}

message EnterLineResponse {
  bool entered = 1;
  string reason = 2;
  string line_id = 3;
  string region_id = 4;
  uint32 line_no = 5;
  uint32 line_size = 6;
  uint32 line_capacity = 7;
  bool duplicate = 8;
  repeated string neighbors = 9;
  repeated string dialogue_ids = 10;
}

message LeaveLineRequest {
  string account = 1;
  uint64 character_id = 2;
}

message LeaveLineResponse {
  bool left = 1;
  string line_id = 2;
  uint32 line_size = 3;
}

// N14：两个字段都空着时只读静态表（老口径，老卡与老屏照旧）；
// 带了角色就按 RegionGate 的结论逐块回「这一刻开没开」。
message ListRegionsRequest {
  string account = 1;
  uint64 character_id = 2;
}

message RegionInfo {
  string id = 1;
  string name = 2;
  repeated uint32 chapters = 3;
  repeated string neighbors = 4;
  repeated string dialogue_ids = 5;
  bool open = 6;
  // N14：open=false 时给原因（region_locked / region_route_mismatch），
  // 开放时是空串。判定仍只在世界服的 RegionGate 一处，网关与客户端都照抄。
  string reason = 7;
  // 剧情解锁要求交完第几场（静态开放与只锁着的地表是 0），只在配置里有条目时非 0。
  int32 unlock_stage = 8;
  // 判定用的主线场次事实值（没带角色号时是 0）。
  int32 main_stage = 9;
}

// 地点与开口的人的编号都从方案正文 2.5 到 2.7 读出来，供客户端与核对比对。
message ListRegionsResponse {
  uint32 version = 1;
  repeated RegionInfo regions = 2;
  repeated string speakers = 3;
  repeated string factions = 4;
}

message ListGatherNodesRequest {}

// 一条节点一行：产物、数量、格位与刷新秒数都是配置事实值，由世界服读出；
// 灵石矿脉 kind=spirit_stone 且没有产物字段，个人采集在世界服一律拒绝。
message GatherNodeInfo {
  string node_id = 1;
  string kind = 2;
  string region_id = 3;
  string item_id = 4;
  int32 count = 5;
  uint32 bag_slot = 6;
  int32 respawn_s = 7;
}

message ListGatherNodesResponse {
  uint32 count = 1;
  repeated GatherNodeInfo nodes = 2;
}

// 一条 WebSocket 上跑位置帧，靠信封分辨。客户端只上报自己的坐标与朝向，
// 没有 account / character_id / line_id / line_size / 别人的位置 / 档位 / 名字这些字段。
message WorldClientFrame {
  oneof body {
    PositionReport position = 1;
  }
}

message PositionReport {
  float x = 1;
  float y = 2;
  float z = 3;
  float facing = 4;
  uint64 seq = 5;
}

message WorldServerFrame {
  oneof body {
    PositionSnapshot snapshot = 1;
    PositionRejected rejected = 2;
  }
}

// 方案写定的同屏三档。档位由世界服按距离算，客户端只按它决定画什么，
// 不在手机上自行决定远处的人该不该画全。两档距离在 config/world.json。
enum AppearanceTier {
  APPEARANCE_TIER_UNSPECIFIED = 0;
  APPEARANCE_TIER_FULL = 1;
  APPEARANCE_TIER_SIMPLE = 2;
  APPEARANCE_TIER_NAME = 3;
}

// 周围的人：同一条分线里的其他成员。这一行不做 AOI、距离裁剪和按档位删人，
// 全量名单照推，只是每个人多带一个服务端算出的档位与名字牌文本。
message AvatarPosition {
  uint64 character_id = 1;
  float x = 2;
  float y = 3;
  float z = 4;
  float facing = 5;
  uint64 seq = 6;
  AppearanceTier appearance_tier = 7;
  string display_name = 8;
  // 技术架构第 4 节写定的少量状态。由世界服判完后随快照下发，
  // 客户端上报帧里没有这两个字段，改包也改不了别人看到的状态。
  bool flying = 9;
  bool can_fly = 10;
}

message PositionSnapshot {
  string line_id = 1;
  string region_id = 2;
  uint64 server_time_ms = 3;
  uint32 sync_hz = 4;
  repeated AvatarPosition avatars = 5;
  uint64 self_character_id = 6;
  bool self_flying = 7;
  bool self_can_fly = 8;
}

// 服务端校验不通过时把上一次合法位置回给自己，别人看到的仍是那一份。
message PositionRejected {
  string reason = 1;
  AvatarPosition corrected = 2;
}

// 采集请求走网关的一条 HTTP，网关认令牌并复核归属后填 account / character_id。
// 客户端只给节点编号：产物、数量、背包格、事务号、身份、分线号都带不进请求。
message GatherRequest {
  string account = 1;
  uint64 character_id = 2;
  string node_id = 3;
}

// 被拒绝时 ok=false，未生效的 item_id / count / bag_slot / txn_id 一律是 0 或空。
// 世界服不直接写角色库：成功的一笔由角色服的 ApplyGrant 落库，txn_id 用过就不能再用。
message GatherResponse {
  bool ok = 1;
  string reason = 2;
  string node_id = 3;
  string kind = 4;
  string item_id = 5;
  int32 count = 6;
  uint32 bag_slot = 7;
  string txn_id = 8;
  bool duplicate = 9;
  int32 respawn_s = 10;
}

// 客户端只给「想不想飞」。账号由网关从令牌取，境界由世界服问角色服，
// 两个值都不在这个请求里；塞 can_fly / realm / account 也不会被读。
message FlyRequest {
  string account = 1;
  uint64 character_id = 2;
  bool want_fly = 3;
}

// 权限不够时 ok=false，flying=false，y 是拉回后的地面高度（沿用 world.json 的 spawn_y）。
// realm / required_realm 是只读展示，客户端不能提交，也不是判定依据。
message FlyResponse {
  bool ok = 1;
  string reason = 2;
  bool flying = 3;
  bool can_fly = 4;
  string realm = 5;
  string required_realm = 6;
  float y = 7;
}

// 跨区只给目标地点编号。当前区域由 LineRegistry 的分线注册表给，
// 相连关系、是否开放与境界门槛都由世界服从配置读，客户端带不进。
message CrossRegionRequest {
  string account = 1;
  uint64 character_id = 2;
  string target_region = 3;
}

// 被拉回时 region_id 是原来那块地表，line_id 是原来那条分线，都没变。
message CrossRegionResponse {
  bool ok = 1;
  string reason = 2;
  string region_id = 3;
  string line_id = 4;
  uint32 line_no = 5;
  string realm = 6;
  string required_realm = 7;
}

// P3-5a：查这一刻的地表入口。空请求——时刻由服务端时钟给，场次编号、上限、
// 归属、剩余时间都由世界服算完再下发，客户端连「我想进哪一场」都表达不了。
message DescribeWorldBossRequest {}

// visible 是「入口这一刻在不在」：窗口内、且这一场还没被打掉才为 true。
// 关着时 reason 说明为什么（not_open 未到点或已过点 / fought 这一场已经打掉 /
// table_missing 没配这张表），window_key / starts_at_ms / ends_at_ms 给 0 或空，
// 不给一个「看起来还能进」的场次。next_starts_at_ms 是下一次出现的时刻，只作展示。
message DescribeWorldBossResponse {
  bool visible = 1;
  string reason = 2;
  string entrance_id = 3;
  string entrance_name = 4;
  string region_id = 5;
  string window_key = 6;
  uint64 starts_at_ms = 7;
  uint64 ends_at_ms = 8;
  uint64 next_starts_at_ms = 9;
  uint32 cap = 10;
  bool killed = 11;
  // 上一场（或这一场）结束时记在入口上的归属宗门。只记名字，不加属性、
  // 不改税收、不把灵石矿脉转走；没有宗门打过就都是空 / 0。
  uint64 owner_sect_id = 12;
  string owner_sect_name = 13;
  string owner_window_key = 14;
  uint64 owner_recorded_at_ms = 15;
}

// 战斗服交回的这一场事实值：打掉没打掉、伤害最高的宗门是谁。
// 请求里没有奖励、没有属性加成、没有税率、没有矿脉归属：记名字就只是记名字。
message RecordWorldBossOwnerRequest {
  string txn_id = 1;
  string entrance_id = 2;
  string window_key = 3;
  bool killed = 4;
  uint64 winner_sect_id = 5;
  string winner_sect_name = 6;
  // 本场有效伤害合计，只作日志与核对的只读事实值。
  int64 damage_total = 7;
}

// ok=false 的 reason：request_missing / unknown_entrance / window_missing /
// wrong_entrance / duplicate（同一个场次已经记过，不覆盖）。entrance_closed
// 表示这一刻入口已经关了（被击杀或已过窗口），关掉之后不再接受新进场。
message RecordWorldBossOwnerResponse {
  bool ok = 1;
  string reason = 2;
  bool duplicate = 3;
  string window_key = 4;
  uint64 owner_sect_id = 5;
  string owner_sect_name = 6;
  bool entrance_closed = 7;
}
