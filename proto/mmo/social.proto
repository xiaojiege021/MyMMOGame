syntax = "proto3";

package mmo.social;

option csharp_namespace = "Mmo.Proto.Social";

// 社交服 gRPC（P2-1a1 + P2-1a2）。宗门五级人数上限与四个职位席位的唯一正本
// 都在 config/sect.json，请求里带不进上限、等级、人数、席位数字；回包里
// member_cap / member_count / seat_cap / seat_count 都是只读事实值。
// txn_id 由网关服务端生成（客户端填不进来）：同一号重放不重复扣创建金币、
// 不重复建宗门；职位是状态设定，重复请求不重复改。
// P2-1a3：掌门改为可变（"社交".sect.master_character_id 是当前掌门唯一权威，
// 创建时 = founder_character_id），任命 / 免职的 not_leader 改查这一列；
// founder_character_id 只作创建历史，不再参与权限判定。传位只给现任副掌门、
// 掌门不能直接退出、有职位的人先辞成弟子再退出宗门。分级任免、改宣言称号、
// 建设升级、秘境人数、同门经验仍不做。
// P2-1a4：升级只耗建设。每级扣一次宗门建设，建设不足被拒且不扣、5 级封顶、
// 名册上限随五档变（CapFor 仍是唯一来源）、已有名册人数不变。升级消耗只从
// config/sect.json 的 upgrade.costs 读，请求里带不进目标等级 / 建设数 / 消耗；
// 建设和贡献来自宗门秘境和宗门任务，不从商城买。升级一笔事务、txn_id 挡重放。

message CreateSectRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  string name = 4;
}

message JoinSectRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  uint64 sect_id = 4;
}

// 只读：按编号或按名字查一个宗门。创建前用它挡重名，不写库。
message DescribeSectRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  uint64 sect_id = 4;
  string name = 5;
}

message SectResponse {
  bool ok = 1;
  // sect_not_found / name_taken / already_member / sect_full / duplicate /
  // request_missing / grant_failed / bad_sect_level；空串表示这一笔做成了。
  // 业务前提不满足是正常回包里的 ok=false + reason，不是 gRPC 错误码。
  string reason = 2;
  uint64 sect_id = 3;
  int32 level = 4;
  int32 member_cap = 5;
  int32 member_count = 6;
  string name = 7;
  // 只作核对：这一笔的事务号，客户端带不进来，也不参与判定。
  string txn_id = 8;
}

// P2-1a2：任命 / 免职 / 只读查席位。account + character_id 是发起者（现任掌门），
// target_character_id 是名册里的被任免者；position 是职位名（master / vice_master /
// elder / steward / disciple），席位数字带不进来。
message PositionRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  uint64 sect_id = 4;
  uint64 target_character_id = 5;
  string position = 6;
}

// 回包前七个字段是这一笔的只读事实值；*_count 只在 DescribePositions 时填，
// 是各职位在名册里的已占席位（事实值），客户端填不进来。
// 业务拒绝（position_full / not_member / not_leader / position_unknown /
// sect_not_found）是正常回包里的 ok=false + reason，seat_count 给 0 表示未生效。
message PositionStateResponse {
  bool ok = 1;
  string reason = 2;
  uint64 sect_id = 3;
  string position = 4;
  int32 seat_cap = 5;
  int32 seat_count = 6;
  string txn_id = 7;
  int32 master_count = 8;
  int32 vice_master_count = 9;
  int32 elder_count = 10;
  int32 steward_count = 11;
  int32 disciple_count = 12;
}

// P2-1a3：传位只给副掌门 / 退出宗门 / 只读查掌门状态。
// account + character_id 是发起者，txn_id 由网关服务端生成（客户端填不进来）；
// target_character_id 是传位目标（现任副掌门），DescribeLeadership 不用（填 0）。
// 请求里带不进「谁是新掌门之外的判定值」：掌门权威、席位数字都只在社交服
// 按 config/sect.json 与库里的事实判定。
message LeadershipRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  uint64 sect_id = 4;
  uint64 target_character_id = 5;
}

// 退出不带 target：谁是新掌门、席位数字一概带不进来。
message LeaveSectRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  uint64 sect_id = 4;
}

// 回包全是只读事实值：old_master / new_master 是传位前后现任掌门，
// master_count / vice_master_count / member_count 是名册里的事实计数，
// txn_id 只作核对。业务拒绝（not_vice_master / not_leader / master_cannot_leave /
// resign_first / sect_not_found / not_member）是正常回包里的 ok=false + reason，
// 未生效数值给 0。
message LeadershipResponse {
  bool ok = 1;
  string reason = 2;
  uint64 sect_id = 3;
  uint64 old_master = 4;
  uint64 new_master = 5;
  int32 master_count = 6;
  int32 vice_master_count = 7;
  int32 member_count = 8;
  string txn_id = 9;
}

// P2-1a4：升级只耗建设 / 只读查升级事实。请求只带发起者 + 宗门 + 事务号，
// 不带目标等级、不带建设数、不带消耗：升到几级、扣多少建设只由社交服按
// config/sect.json 的 upgrade.costs 与库里的事实判定（不跳级：请求里没有目标等级）。
// txn_id 由网关服务端生成（客户端填不进来），sect_upgrade.txn_id 主键 +
// sect.last_upgrade_txn 挡同一事务号重放。
message UpgradeSectRequest {
  string account = 1;
  uint64 character_id = 2;
  string txn_id = 3;
  uint64 sect_id = 4;
}

// 回包全是只读事实值。业务拒绝（not_enough_construction / at_max_level /
// not_leader / sect_not_found / duplicate）是正常回包里的 ok=false + reason，
// 未生效数值给 0。member_cap 由 CapFor(new_level) 给，是名册上限唯一来源；
// construction_before / construction_after / upgrade_cost 都是这一笔库里的事实值。
message UpgradeResponse {
  bool ok = 1;
  string reason = 2;
  uint64 sect_id = 3;
  int32 old_level = 4;
  int32 new_level = 5;
  int32 member_cap = 6;
  int64 construction_before = 7;
  int64 construction_after = 8;
  int64 upgrade_cost = 9;
  string txn_id = 10;
}

// P2-1c：只读查一个角色当前归属的宗门编号。建宗门的人不进名册（册里只有弟子），
// 因此判定要同时看 sect_member.sect_id 与 sect.master_character_id：两条都查不到
// 才算没宗门。用于角色服判「整队是否同宗门」——只回宗门编号，不写库。
message DescribeCharacterSectRequest {
  // 服间可信调用；account 仅作日志上下文，不参与归属判定。
  string account = 1;
  uint64 character_id = 2;
}

message DescribeCharacterSectResponse {
  bool ok = 1;
  // character_not_found / 空串表示查到了（found 决定有没有 sect_id）。
  string reason = 2;
  // true 表示进了某个宗门（含掌门本人）；false 表示没宗门，sect_id 给 0。
  bool found = 3;
  // 归属的宗门编号。掌门本人按 master_character_id 命中，sect_id 等于其宗门。
  uint64 sect_id = 4;
}

service SocialService {
  rpc CreateSect(CreateSectRequest) returns (SectResponse);
  rpc JoinSect(JoinSectRequest) returns (SectResponse);
  rpc DescribeSect(DescribeSectRequest) returns (SectResponse);
  rpc AppointPosition(PositionRequest) returns (PositionStateResponse);
  rpc DismissPosition(PositionRequest) returns (PositionStateResponse);
  rpc DescribePositions(PositionRequest) returns (PositionStateResponse);
  // P2-1a3：传位只给副掌门 / 掌门不能直接退出 / 只读查掌门状态。
  rpc TransferLeadership(LeadershipRequest) returns (LeadershipResponse);
  rpc LeaveSect(LeaveSectRequest) returns (LeadershipResponse);
  rpc DescribeLeadership(LeadershipRequest) returns (LeadershipResponse);
  // P2-1a4：升级只耗建设（建设不从商城买）/ 只读查升级事实。
  rpc UpgradeSect(UpgradeSectRequest) returns (UpgradeResponse);
  rpc DescribeUpgrade(UpgradeSectRequest) returns (UpgradeResponse);
  // P2-1c：只读查一个角色当前归属的宗门编号。判同宗门加成在角色服调用；
  // found=false 表示没进宗门（含掌门本人：建宗门不进名册，按 master_character_id 判）。
  rpc DescribeCharacterSect(DescribeCharacterSectRequest) returns (DescribeCharacterSectResponse);
}
