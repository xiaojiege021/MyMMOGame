syntax = "proto3";

package mmo.battle;

option csharp_namespace = "Mmo.Proto.Battle";

// 副本里一条技能一次请求。字段按方案正文与技术架构第 4 节：
// 请求带技能编号、目标编号和客户端认为的施放时刻。
// 施法者不放在消息里，由这条连接的身份决定，客户端改不了。
message SkillRequest {
  uint32 skill_id = 1;
  uint64 target_id = 2;
  int64 cast_time_ms = 3;
}

// 战斗服结算完回给本里的这条命。冷却和硬直都用毫秒。
// 治疗和伤害分两个字段，没发生的那个是 0，不用一个字段兼两义。
message SkillResult {
  uint64 caster_id = 1;
  uint32 skill_id = 2;
  uint64 target_id = 3;
  bool hit = 4;
  int64 damage = 5;
  int64 healing = 6;
  uint32 stagger_ms = 7;
  uint32 cooldown_ms = 8;
  // 这一下之后目标还剩多少血。客户端照着这个改血条，不自己算。
  int64 target_hp_after = 9;
  // 这一下之后施法者还剩多少蓝。蓝也只在服务端结算。
  int64 mana_after = 10;
  // 施法者的累计有效仇恨（打出的伤害 + 职业稳定值）。给核对与界面用。
  int64 threat_after = 11;
}

// 拒绝的原因。客户端按这个停掉前摇，不改画面上的血量。
enum SkillRejectReason {
  SKILL_REJECT_UNSPECIFIED = 0;
  // 这场已经结束，或者这个人不在这场里
  SKILL_REJECT_NOT_IN_BATTLE = 1;
  // 配置里没有这个技能编号
  SKILL_REJECT_UNKNOWN_SKILL = 2;
  // 目标已经不在场上
  SKILL_REJECT_TARGET_GONE = 3;
  // 施法者已经倒地
  SKILL_REJECT_CASTER_DEAD = 4;
  // 冷却没好，retry_after_ms 是还差多少
  SKILL_REJECT_COOLDOWN = 5;
  // 距离不够，这一下打不到
  SKILL_REJECT_OUT_OF_RANGE = 6;
  // 上一个技能还在前摇里，一次只结算一个
  SKILL_REJECT_CASTING = 7;
  // 上一个技能已经结算，后摇还没走完
  SKILL_REJECT_RECOVERY = 8;
  // 蓝不够。主动技能耗蓝，蓝不够就放不出去
  SKILL_REJECT_NO_MANA = 9;
  // 目标不对：复活选了自己，或者选的不是倒地的队友
  SKILL_REJECT_BAD_TARGET = 10;
}

// 没有结算就退回来了。这条不改变任何人的生命。
message SkillRejected {
  uint32 skill_id = 1;
  uint64 target_id = 2;
  int64 cast_time_ms = 3;
  SkillRejectReason reason = 4;
  // 只有冷却没好时才有意义，其它原因填 0
  uint32 retry_after_ms = 5;
}

// 命中判定之前取消这次施法。前摇里可以走位，也可以打断。
// cast_time_ms 用来对上被取消的那一次，避免取消到后来的施法。
message SkillCancelRequest {
  uint32 skill_id = 1;
  int64 cast_time_ms = 2;
}

// accepted 为真表示这次施法被撤掉了，没有伤害，冷却也退回去。
// 为假表示已经结算完了，撤不回来，那一下照常生效。
message SkillCancelled {
  uint32 skill_id = 1;
  int64 cast_time_ms = 2;
  bool accepted = 3;
}

// 前摇里可以走位。客户端报它想到的位置，服务端按速度上限和场地半径夹取，
// 不直接采信客户端坐标；技能的距离判定用的是夹取之后的坐标。
// client_time_ms 只用来对号，不当作权威时间。
message MoveRequest {
  int32 x_mm = 1;
  int32 y_mm = 2;
  int64 client_time_ms = 3;
}

// 夹取之后的实际位置，以及到目标的直线距离。
// clamped 为真表示客户端报的位置越过了速度或场地边界，被服务端拉回来了。
message MoveState {
  int32 x_mm = 1;
  int32 y_mm = 2;
  uint32 distance_mm = 3;
  bool clamped = 4;
}

// 开场时一起下发技能表。客户端按编号查前摇时长和名字，不在前端写死数值；
// 伤害不下发，客户端只认 SkillResult 里的那一个数。
message SkillInfo {
  uint32 skill_id = 1;
  string name = 2;
  uint32 range_mm = 3;
  uint32 foreswing_ms = 4;
  uint32 recovery_ms = 5;
  uint32 cooldown_ms = 6;
  uint32 stagger_ms = 7;
  // 这一手的蓝耗。普攻可以是 0，主动技能大于 0，数值都来自配置。
  uint32 mana_cost = 8;
}

// 职业目录。客户端的换职业按钮按这个循环。
message ClassInfo {
  string class_id = 1;
  string name = 2;
}

// 一场里的一个成员。血量和倒地状态都由服务端说了算。
message PartyMember {
  uint64 member_id = 1;
  string class_id = 2;
  string name = 3;
  int64 hp = 4;
  int64 hp_max = 5;
  bool down = 6;
}

// 连上就开一场。P0 不做进本协议，网关鉴权也放到后续。
message BattleOpened {
  uint64 session_id = 1;
  uint64 caster_id = 2;
  uint64 boss_id = 3;
  int64 boss_hp = 4;
  int64 boss_hp_max = 5;
  int64 caster_hp = 6;
  int64 caster_hp_max = 7;
  // 双方直线距离，毫米
  uint32 distance_mm = 8;
  // 这一场可用的技能，按编号升序
  repeated SkillInfo skills = 9;
  // 场地半径与移动速度。客户端拿它做本地预摆放，最终位置仍以服务端为准
  uint32 arena_radius_mm = 10;
  uint32 move_speed_mm_per_s = 11;
  // 施法者出生坐标，Boss 为原点。客户端照这个摆自己，不用从距离反推
  int32 caster_x_mm = 12;
  int32 caster_y_mm = 13;
  // 这个人的职业与蓝条。蓝量上限 = 职业基础 + 精神 × 职业系数，都在服务端算。
  string class_id = 14;
  string class_name = 15;
  int64 mana = 16;
  int64 mana_max = 17;
  // 同一场里的所有人，含自己。血量与倒地状态照这个显示。
  repeated PartyMember party = 18;
  // 可选职业目录。换职业要重连一场，客户端按这个循环。
  repeated ClassInfo classes = 19;
}

// 这场收尾。settlement_id 是写进结算记录的事务号；
// 没写成就为空，客户端不能拿空号去领奖。
message BattleEnded {
  uint64 session_id = 1;
  bool cleared = 2;
  string settlement_id = 3;
  int64 exp_gain = 4;
}

// 一个成员的血量或倒地状态变了：Boss 打中了谁、谁被拉起来。
// 谁掉的血、掉了多少，只有服务端知道，客户端照这个改画面。
message MemberUpdated {
  PartyMember member = 1;
}

// Boss 换阶段了。阶段来自配置，到血线就切，不设霸体条和破防窗口。
message BossPhase {
  int32 phase_index = 1;
  string name = 2;
}

// 一条 WebSocket 上跑多种消息，靠这个信封分辨。
message ClientMessage {
  oneof body {
    SkillRequest skill = 1;
    SkillCancelRequest cancel = 2;
    MoveRequest move = 3;
    // 用一张符（红符 / 蓝符，编号由角色服配置认定）。注意这条请求里没有目标编号：
    // 符只回复自己，结构上就指不到队友身上。要治队友只能走牧师的技能。
    UseTalismanRequest talisman = 4;
    // P1-5c6：用一张复活卷轴。同样没有目标编号——方案 12.1 写定「只拉起自己，
    // 不能拉队友」，这条协议表达不出「拉别人」；拉队友只能走牧师的生息。
    UseReviveScrollRequest scroll = 5;
  }
}

message ServerMessage {
  oneof body {
    BattleOpened opened = 1;
    SkillResult result = 2;
    SkillRejected rejected = 3;
    SkillCancelled cancelled = 4;
    BattleEnded ended = 5;
    MoveState moved = 6;
    MemberUpdated member_updated = 7;
    BossPhase boss_phase = 8;
    // 进本被拒。这条发完就关连接，客户端据此提示「本满了/只能一个人」。
    EnterRejected enter_rejected = 9;
    // 用掉了一张符。healed / restored 是实际回复量（会被池上限截断）。
    TalismanUsed talisman_used = 10;
    // 符没用成。这条不改任何人的生命与蓝量，也不扣符。
    TalismanRejected talisman_rejected = 11;
    // P1-5c6：用掉了一张复活卷轴。只回给本人，不广播。
    ReviveScrollUsed scroll_used = 12;
    // 卷轴没用成。不扣卷轴、不扣经验、不写冷却，也不改生命与蓝量。
    ReviveScrollRejected scroll_rejected = 13;
  }
}

// 进本被拒的原因。上限与当前人数一起给，客户端能说清是哪种满。
message EnterRejected {
  // party_full：这一场的人已经到上限（主线就是 1）。
  // dungeon_unknown：副本号不在表里。
  // dungeon_mismatch：同一个队伍地址被用在两个不同的本上。
  string reason = 1;
  uint32 limit = 2;
  uint32 current = 3;
  string dungeon_id = 4;
}

// 在战斗里用掉一张符。请求里只有物品编号与客户端时刻：
// 目标恒是施法者自己（方案 12.1「只回复自己」），是哪个池、回复量与冷却
// 都由角色服按配置给，请求里一个服务端数值都没有。
message UseTalismanRequest {
  string item_id = 1;
  int64 client_time_ms = 2;
}

// 用掉了。回复只落在角色服认定的那一个池里，另一个池的数值原样回、不改动。
message TalismanUsed {
  uint64 caster_id = 1;
  string item_id = 2;
  // 实际回血量：红符是被血量上限截断后的值，蓝符恒 0（方案 12.1「不回血」）。
  int64 healed = 3;
  // 这一下之后自己的血。蓝符时与用符前相同。
  int64 hp_after = 4;
  uint32 cooldown_ms = 5;
  // 红符是 heal 组（和红药、牧师治疗共用），蓝符是 mana 组（和蓝药共用）。
  string cooldown_group = 6;
  // 扣掉之后背包里还剩几张。
  int64 count_left = 7;
  // 角色服回包里的池，原样带给客户端展示："hp" / "mana"。
  string pool = 8;
  // 这个池的实际回复量：红符等于 healed，蓝符等于回蓝量。
  int64 restored = 9;
  // 这一下之后自己的蓝。红符时与用符前相同。
  int64 mana_after = 10;
  // 实际回蓝量：蓝符是被蓝量上限截断后的值，红符恒 0。
  int64 mana_restored = 11;
}

// 符没用成。不改任何人的生命与蓝量，也不扣符。
message TalismanRejected {
  string item_id = 1;
  // not_in_battle / caster_down / hp_full / mana_full / cooldown / not_talisman /
  // no_talisman / upstream_off / server_error
  string reason = 2;
  // 只有冷却没好时才有意义，其它原因填 0。
  uint32 retry_after_ms = 3;
  int64 hp_after = 4;
  // 拒绝之后的蓝量，给界面回显：这一手没有回蓝。
  int64 mana_after = 5;
}

// P1-5c6：在战斗里用掉一张复活卷轴。请求里只有物品编号与客户端时刻：
// 目标恒是发起者自己（方案 12.1「只拉起自己，不能拉队友」），
// 回复比例、经验比例与冷却都由角色服按配置给，请求里一个服务端数值都没有。
message UseReviveScrollRequest {
  string item_id = 1;
  int64 client_time_ms = 2;
}

// 用掉了。hp_after 是一小段生命（不满血），mana_after 与用之前一模一样（不回蓝）。
// exp_cost 是这次扣掉的当前级经验，当前级经验是零时为 0，level 不变。
message ReviveScrollUsed {
  uint64 caster_id = 1;
  string item_id = 2;
  int64 hp_after = 3;
  int64 mana_after = 4;
  int64 exp_cost = 5;
  int64 level = 6;
  int64 exp_after = 7;
  // 配置里的冷却时长与角色服写进库的到期时刻，给界面回显；跨场保留在角色库。
  uint32 cooldown_ms = 8;
  int64 ready_at_ms = 9;
  // 扣掉之后背包里还剩几张。
  int64 count_left = 10;
}

// 卷轴没用成。不改任何人的生命与蓝量，不扣卷轴、不扣经验、不写冷却。
message ReviveScrollRejected {
  string item_id = 1;
  // not_in_battle（本场已结算）/ left_battle（人已离开）/ not_down（还活着）/
  // cooldown（全局冷却没到）/ not_scroll / no_scroll / upstream_off / server_error
  string reason = 2;
  // 只有 cooldown 才有意义，其它原因填 0。
  uint32 retry_after_ms = 3;
  int64 hp_after = 4;
  int64 mana_after = 5;
}
